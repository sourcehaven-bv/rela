<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ticket Counter</title>
    <!-- App self-description, read by rela for the sidebar. The app id is the
         folder name (ticket-counter); remove index.html or rename the folder to
         unpublish. -->
    <meta name="rela-app:bridge-version" content="1" />
    <meta name="rela-app:label" content="Ticket Counter" />
    <meta name="rela-app:description" content="Counts tickets by status via the rela bridge" />
    <!-- The rela bridge SDK (window.rela). Served by rela at this app's own
         path; the path-scoped CSP allows it. -->
    <script src="_rela.js"></script>
    <!-- Opt into rela's theme tokens + base controls (.btn/.input/.card).
         Dark mode follows the host automatically (the SDK toggles .dark). -->
    <link rel="stylesheet" href="_rela.css" />
    <!-- This app's own styles. A separate file, not an inline <style>:
         the app CSP has no 'unsafe-inline', so inline CSS is blocked. -->
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <h1>Tickets by status</h1>
    <div id="status" class="muted">Connecting…</div>
    <table id="table" class="card counts-table" hidden>
      <thead>
        <tr><th>Status</th><th>Count</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <button id="refresh" class="btn refresh-button" hidden>Refresh</button>

    <script src="app.js"></script>
  </body>
</html>
