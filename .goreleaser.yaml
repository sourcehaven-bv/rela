# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: rela

before:
  hooks:
    - go mod tidy

builds:
  - id: rela
    main: ./cmd/rela
    binary: rela
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Sourcehaven-BV/rela/internal/cli.Version={{.Version}}
    flags:
      - -trimpath

  - id: rela-server
    main: ./cmd/rela-server
    binary: rela-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath

  # rela-docs: renders Markdown manuals with rela Lua islands (incl. live
  # screenshot{} captures). Kept a separate binary because screenshot{} links
  # chromedp (~15 MB) via internal/docscapture — weight the default rela /
  # rela-server binaries never carry. Default (filesystem) build only:
  # screenshot{} fails loud on the postgres build (it would seed the live DB),
  # so there is no rela-docs-postgres variant.
  - id: rela-docs
    main: ./cmd/rela-docs
    binary: rela-docs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    flags:
      - -trimpath

  # PostgreSQL-backed variants. Selected by the `postgres` build tag: the
  # store and search index live in PostgreSQL (no bleve, no on-disk markdown
  # store). Shipped under -postgres binary + archive names so they never
  # collide with the default filesystem binaries on PATH.
  - id: rela-postgres
    main: ./cmd/rela
    binary: rela-postgres
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Sourcehaven-BV/rela/internal/cli.Version={{.Version}}
    flags:
      - -trimpath
      - -tags=postgres

  - id: rela-server-postgres
    main: ./cmd/rela-server
    binary: rela-server-postgres
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath
      - -tags=postgres

  # SQLite-backed variants. Selected by the `sqlite` build tag: entities,
  # relations and attachments live in a single embedded database file under
  # .rela/, with bleve for search. Single-process by design (the store refuses
  # a second opener), so this is the desktop / single-server option that needs
  # no database server.
  #
  # CGO_ENABLED=0 like every other binary: modernc.org/sqlite is pure Go, which
  # is why it was chosen over mattn/go-sqlite3 — the release matrix stays free.
  - id: rela-sqlite
    main: ./cmd/rela
    binary: rela-sqlite
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Sourcehaven-BV/rela/internal/cli.Version={{.Version}}
    flags:
      - -trimpath
      - -tags=sqlite

  - id: rela-server-sqlite
    main: ./cmd/rela-server
    binary: rela-server-sqlite
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath
      - -tags=sqlite

archives:
  # Default (filesystem) binaries: rela + rela-server bundled together,
  # keeping the historical archive name so existing download URLs/scripts
  # keep working.
  - id: default
    ids:
      - rela
      - rela-server
      - rela-docs
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

  # PostgreSQL binaries in their own -postgres archive so a user can't
  # accidentally extract both variants onto the same PATH.
  - id: postgres
    ids:
      - rela-postgres
      - rela-server-postgres
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-postgres_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

  # SQLite binaries in their own -sqlite archive, for the same reason the
  # postgres ones are separated: extracting two variants onto one PATH would
  # leave which backend you get depending on shell lookup order.
  - id: sqlite
    ids:
      - rela-sqlite
      - rela-server-sqlite
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-sqlite_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

# Snapshot builds (`goreleaser release --snapshot`) publish nothing. They are
# used by .github/workflows/staging-build.yml to produce a tarball for the atlas
# STAGING environment from an arbitrary branch or PR, without cutting a tag or
# a release.
#
# The version must be supplied here rather than via GORELEASER_CURRENT_TAG: in
# snapshot mode GoReleaser ignores that env var and derives the version from
# this template instead. STAGING_VERSION is exported by the workflow as
# <calver>-alpha-<short-sha>; the fallback keeps a hand-run
# `goreleaser release --snapshot` working locally.
#
# This feeds archives' {{ .Version }}, so the asset lands as
# rela-postgres_<version>_linux_amd64.tar.gz — the exact name the devops
# roles/atlas reconstructs when it downloads and sha256-verifies a pin.
snapshot:
  version_template: '{{ envOrDefault "STAGING_VERSION" (printf "%s-snapshot-%s" .Version .ShortCommit) }}'

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: Sourcehaven-BV
    name: rela
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"
  header: |
    ## macOS Desktop App

    The macOS desktop app is ad-hoc signed. After opening the DMG and dragging the app
    to Applications, macOS Gatekeeper may block it. To allow it to run:

    ```bash
    xattr -cr "/Applications/Rela Desktop.app"
    ```

    Alternatively, right-click the app and select **Open**, then confirm in the dialog.

# Homebrew tap (optional - uncomment when you have a homebrew-tap repo)
# brews:
#   - repository:
#       owner: Sourcehaven-BV
#       name: homebrew-tap
#     homepage: https://github.com/Sourcehaven-BV/rela
#     description: Traceability CLI for managing entities and relationships
#     license: MIT
