version: "1.0"
description: |
  A lightweight ticket tracker: capture work as tickets, group them into
  categories, tag and cross-link them, and move each ticket through a simple
  lifecycle from open to closed. This description, the per-status explanations,
  and the transition help below are surfaced by the generated documentation
  (`rela docs`).
types:
  ticket_status:
    values: [open, in-progress, resolved, closed]
    default: open
    initial: open
    labels:
      in-progress: In progress
    descriptions:
      open: A newly filed ticket that no one has started yet.
      in-progress: Someone is actively working on the ticket.
      resolved: The work is done and awaiting confirmation before it is closed.
      closed: The ticket is finished; no further work is expected.
    transitions:
      - from: open
        to: in-progress
        label: Start work
        help: Move a ticket here once someone picks it up and begins working on it.
      - from: in-progress
        to: resolved
        label: Mark resolved
        help: Use this when the work is complete and ready for the reporter to verify.
      - from: resolved
        to: closed
        label: Close
        help: Close the ticket once the reporter has confirmed the resolution.
      - from: resolved
        to: in-progress
        label: Reopen
        help: Send it back to in-progress if verification finds the work is not done.
  priority:
    values: [critical, high, medium, low]
    default: medium
    descriptions:
      critical: Needs immediate attention; blocks other work or users.
      high: Important; should be handled soon.
      medium: Normal priority.
      low: Nice to have; handle when there is spare capacity.
entities:
  ticket:
    label: Ticket
    id_prefix: "TKT-"
    id_type: sequential
    properties:
      title:
        type: string
        required: true
      description:
        type: string
      status:
        type: ticket_status
        required: true
      priority:
        type: priority
        required: true
      assignee:
        type: string
      reporter:
        type: string
        required: true
      due_date:
        type: date
      estimated_hours:
        type: integer
      is_blocked:
        type: boolean
  category:
    label: Category
    plural: categories
    id_prefix: "CAT-"
    id_type: sequential
    properties:
      name:
        type: string
        required: true
      description:
        type: string
      color:
        type: string
  label:
    label: Label
    id_prefix: "LBL-"
    id_type: sequential
    properties:
      name:
        type: string
        required: true
  tag:
    label: Tag
    id_type: manual
    properties:
      name:
        type: string
        required: true
  decision:
    label: Decision
    id_prefixes: ["DEC-", "ADR-"]
    id_type: sequential
    properties:
      title:
        type: string
        required: true
  module:
    label: Module
    id_type: manual
    id_prefix: "MOD-"
    properties:
      name:
        type: string
        required: true
  specification:
    label: Specification
    id_type: manual
    id_prefixes: ["RFC-", "SPEC-"]
    properties:
      name:
        type: string
        required: true
relations:
  belongs-to:
    label: belongs to
    from: [ticket]
    to: [category]
    inverse: contains
  tagged:
    label: tagged
    from: [ticket]
    to: [label]
    inverse: appliedTo
    properties:
      added_by:
        type: string
        description: Who added this tag
      added_date:
        type: date
        description: When the tag was added
  blocks:
    label: blocks
    from: [ticket]
    to: [ticket]
    inverse: blockedBy
    properties:
      reason:
        type: string
        required: true
        description: Why this ticket blocks the other
      severity:
        type: enum
        values: [critical, high, medium, low]
        default: medium
      resolved_date:
        type: date
        description: When the blocker was resolved
      impact_score:
        type: integer
        description: Impact score from 1-10
      is_workaround_available:
        type: boolean
        description: Whether a workaround exists
