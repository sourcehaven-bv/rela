# Go vulnerability scanning lives HERE, not on the PR path.
#
# ci.yml used to carry a `Vulnerability Check` job. It only scanned when a PR
# changed go.mod/go.sum, but the merge queue runs on `merge_group` rather than
# `pull_request`, which took the unconditional-scan branch. So an advisory
# published against an existing dependency would pass on the PR (skipped in
# ~6s), then fail in the queue and dequeue a change that had nothing to do with
# dependencies. That is what happened to #1520: two x/crypto/ssh advisories,
# already latent on develop, blocked a path-validation PR twice.
#
# A vulnerability in an already-merged dependency is not a defect in the PR that
# happens to be in flight, so it should not block it. This workflow scans on a
# schedule and opens an auto-merging fix PR instead — which is also what
# actually resolves the vulnerability, rather than just reporting it.
name: Security Scan

on:
  schedule:
    # Daily at 9:00 UTC. This is now the primary gate on Go vulnerabilities,
    # so the cadence here is the window in which a newly-published advisory
    # sits unnoticed. Weekly made that window up to 7 days.
    - cron: "0 9 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # rela-desktop links Wails v3, whose Linux build needs GTK4 + WebKitGTK
      # headers to type-check. Without them govulncheck cannot load the cgo
      # packages and fails — and the desktop binary is precisely the one
      # shipped to users, so excluding it from the scan is not an option.
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (initial)
        id: vulncheck
        run: |
          set -euo pipefail
          status=0
          ./scripts/govulncheck-filtered.sh > /tmp/vulncheck.log 2>&1 || status=$?
          cat /tmp/vulncheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Don't fail the step — follow-up steps decide what to do.

      - name: Try auto-update for fixable vulns
        id: autoupdate
        if: steps.vulncheck.outputs.status != '0'
        env:
          # setup-go sets GOTOOLCHAIN=local. The re-scan must run on the
          # toolchain go.mod now names, or a stdlib fix never verifies.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail

          # Extract fixable (called) vulns: <module> <fixed-version>.
          # stderr stays out of the JSON, or a warning would break the parse.
          govulncheck -format json ./... > /tmp/vulncheck.json 2> /tmp/vulncheck-json.err || true
          if [[ -s /tmp/vulncheck-json.err ]]; then
            echo "govulncheck stderr:"
            cat /tmp/vulncheck-json.err
          fi
          # Exit 1 means nothing fixable; any other failure is the picker's.
          rc=0
          ./scripts/govulncheck-fixable.sh < /tmp/vulncheck.json > /tmp/fixable.txt || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            if [[ "$rc" -eq 1 ]]; then
              echo "No fixable, called vulnerabilities — falling through to issue-filing."
            else
              echo "Fix picker failed (rc=$rc) — falling through to issue-filing."
            fi
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Fixable vulnerabilities:"
          cat /tmp/fixable.txt

          # One line per module, already at the highest fixed version for the
          # version in use (see the script header).
          while read -r mod ver; do
            [[ -z "$mod" ]] && continue
            # A standard-library fix needs a newer Go, not a module upgrade.
            # Workflows read the version from go.mod, so this is the only pin.
            if [[ "$mod" == "stdlib" ]]; then
              target="toolchain@go$ver"
            else
              target="$mod@v$ver"
            fi
            echo "go get $target"
            go get "$target" < /dev/null || {
              echo "go get failed for $target; may be transitive-only; continuing."
            }
          done < /tmp/fixable.txt
          go mod tidy

          # Re-run govulncheck to confirm no called vulns remain.
          if ./scripts/govulncheck-filtered.sh > /tmp/vulncheck2.log 2>&1; then
            echo "Auto-update resolved all called vulnerabilities."
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Auto-update did not resolve all called vulnerabilities:"
            cat /tmp/vulncheck2.log
            echo "fixed=partial" >> "$GITHUB_OUTPUT"
          fi

      - name: Open auto-update PR with auto-merge
        if: steps.autoupdate.outputs.fixed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- go.mod go.sum; then
            echo "No go.mod/go.sum diff despite auto-update — nothing to open."
            exit 0
          fi

          BRANCH="chore/govulncheck-autoupdate"
          BASE="$GITHUB_REF_NAME"

          # Clean any stale branch from a previous run.
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add go.mod go.sum
          git commit -m "chore(deps): govulncheck auto-update for fixable vulnerabilities

          Automated by the daily Security Scan workflow. See run:
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push -u origin "$BRANCH"

          # Ensure labels exist (idempotent).
          gh label create security  --repo "$GITHUB_REPOSITORY" --color B60205 --description "Security-related issue"  --force >/dev/null
          gh label create automated --repo "$GITHUB_REPOSITORY" --color EDEDED --description "Filed by an automated job" --force >/dev/null
          gh label create dependencies --repo "$GITHUB_REPOSITORY" --color 0366D6 --description "Dependency update" --force >/dev/null

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "chore(deps): govulncheck auto-update" \
            --label security,automated,dependencies \
            --body "Auto-applied \`go get\` (module or toolchain) updates to resolve vulnerabilities found by the daily scan. Verified locally that post-update \`govulncheck\` is clean. Enabled auto-merge once CI passes.")

          gh pr merge "$PR_URL" --auto --squash

      - name: File issue (no auto-fix available)
        if: steps.vulncheck.outputs.status != '0' && steps.autoupdate.outputs.fixed != 'true'
        env:
          # GITHUB_TOKEN, not the app token. Issues the app created carried no
          # labels (their timelines show no `labeled` event), so a
          # label-filtered dedup never found them and each run opened a new
          # one (BUG-NVNPD8). Issues filed with GITHUB_TOKEN keep their labels.
          # An issue needs no app token: nothing has to trigger on it.
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          TITLE='govulncheck scheduled scan found vulnerabilities'

          gh label create security  --repo "$GITHUB_REPOSITORY" --color B60205 --description "Security-related issue"  --force >/dev/null
          gh label create automated --repo "$GITHUB_REPOSITORY" --color EDEDED --description "Filed by an automated job" --force >/dev/null

          LOG=$(tail -c 8000 /tmp/vulncheck.log 2>/dev/null || echo '(no log captured)')

          BODY=$(cat <<'BODY_EOF'
          The daily `govulncheck` scan found actionable vulnerabilities that the auto-update workflow could not resolve (no upstream fix, or update did not clear the finding).

          Scan run: __RUN_URL__

          <details>
          <summary>Output (last 8KB)</summary>

          ```
          __LOG__
          ```

          </details>

          To triage:
          - Run `just govulncheck` locally to reproduce.
          - If upstream has a fix that the auto-update script missed, upgrade manually.
          - If no fix is available, add the OSV id to `IGNORED_OSVS` in `scripts/govulncheck-filtered.sh` and `scripts/govulncheck-fixable.sh` with a justification and tracking link.

          This issue will be updated by subsequent daily runs rather than duplicated.
          BODY_EOF
          )
          BODY=${BODY//__RUN_URL__/$RUN_URL}
          BODY=${BODY//__LOG__/$LOG}

          # Match the exact title, and only issues this workflow filed: anyone
          # can open an issue with this title, and matching it would let them
          # capture or bury the scan reports. github-actions files them now;
          # rela-coverage-bot (the app) filed them before BUG-NVNPD8. Labels
          # are not checked because the app's issues carry none. TITLE goes
          # to jq as --arg, never spliced into the program.
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$TITLE\" in:title" \
            --json number,title,author \
            | jq -r --arg title "$TITLE" '
                [ .[]
                  | select(.title == $title)
                  | select(.author.login == "app/github-actions"
                           or .author.login == "app/rela-coverage-bot")
                ][0].number // empty')

          if [[ -n "$EXISTING" ]]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            echo "Creating new issue"
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --label security,automated \
              --body "$BODY"
          fi
