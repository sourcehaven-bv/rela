name: Fuzz Sweep

# Weekly sweep over every fuzz target in the repo (the per-PR fuzz job
# in ci.yml runs only a 3-target smoke). Targets are discovered by
# scripts/fuzz-all.sh, so new Fuzz* functions are swept automatically.
#
# On failure: the crashing inputs are uploaded as an artifact and one
# GitHub issue is filed per failing target, so findings don't silently
# rot in the Actions tab. A target that fails again while its issue is
# still open gets a comment there instead of a duplicate issue.
#
# Note: the pgstore fuzz targets self-skip without
# RELA_TEST_DATABASE_URL; wiring a postgres service into this sweep is
# a known follow-up.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, before the weekly security scan
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz-sweep:
    name: Fuzz all targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Run all fuzz targets
        run: FUZZTIME=25s scripts/fuzz-all.sh

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failing-inputs
          path: |
            internal/**/testdata/fuzz/**
            fuzz-failures.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: File a fuzz-failure issue per failing target
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Config/setup errors (script exit 2 — bad FUZZTIME, broken
          # build, zero targets) produce no summary file and should fail
          # the run without filing a "fuzz found a bug" issue.
          if [ ! -f fuzz-failures.txt ]; then
            echo "No target-failure summary — setup error, not filing an issue."
            exit 0
          fi
          # A missing label is cosmetic; an unfiled crash is not. This is
          # a no-op whenever the label already exists, so its only real
          # effect under `set -e` would be to kill the step on a blip.
          gh label create fuzz-failure \
            --description "Filed automatically by the weekly fuzz sweep" \
            --color D93F0B --force \
            || echo "WARNING: could not create/update the fuzz-failure label, continuing"

          # One issue per failing target, not one issue per sweep: a
          # sweep that finds three unrelated crashes is three bugs, and
          # each needs its own fix, assignee and close. Identity is the
          # (package, target) pair, carried in the title and matched
          # exactly on the next sweep — so a recurrence comments on its
          # own issue and a newly broken target opens a fresh one.
          file_failures=0
          ISSUE_PAGE_LIMIT=200
          while read -r pkg target kind; do
            [ -n "${target:-}" ] || continue
            title="Fuzz failure: ${target} (${pkg#./})"

            {
              echo "The weekly fuzz sweep failed this target."
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Package | \`${pkg}\` |"
              echo "| Target | \`${target}\` |"
              echo "| Kind | \`${kind}\` |"
              echo ""
              echo "Run: ${RUN_URL}"
              echo ""
              # Only a fuzz-crash writes a corpus file. Pointing an
              # `error` at testdata/fuzz/<Target>/ sends the reader after
              # files that do not exist (the artifact step is
              # if-no-files-found: ignore, so it may hold only the summary).
              case "$kind" in
                *fuzz-crash*)
                  echo "\`fuzz-crash\` means a crashing input was found."
                  echo ""
                  echo "The crashing inputs are attached to the run as the **fuzz-failing-inputs** artifact."
                  echo "To reproduce locally: copy the artifact's \`testdata/fuzz/${target}/\` files into"
                  echo "\`${pkg}\`, then \`go test -run='^${target}\$' ${pkg}\` — the failing input now runs"
                  echo "as a regular regression test. Once fixed, commit the input as a seed."
                  ;;
                *)
                  echo "\`error\` means the target failed for an infrastructure reason,"
                  echo "e.g. a seed-corpus regression or a build failure — NOT necessarily a"
                  echo "new crashing input, so there may be no corpus file to reproduce from."
                  echo "Start with the run log for this target."
                  ;;
              esac
            } > issue-body.md

            # Fetch the open fuzz-failure issues, then match the title
            # EXACTLY below — a prefix or fuzzy match would alias two
            # targets onto one issue.
            #
            # A FAILED query must never be read as "no match": both are
            # the empty string, and guessing "no match" files a duplicate
            # of an issue that already exists and is probably assigned.
            # Fail closed — a skipped comment costs one week of signal on
            # a bug already tracked; a duplicate costs manual triage every
            # week thereafter.
            if ! listing="$(gh issue list --label fuzz-failure \
              --state open --limit "$ISSUE_PAGE_LIMIT" --json number,title 2>&1)"; then
              echo "WARNING: could not query existing issues for ${title}: ${listing}"
              file_failures=$((file_failures + 1))
              continue
            fi

            # The match is client-side over a server-side page, so a full
            # page could hide an existing issue and make us file a
            # duplicate. Unreachable today (the sweep discovers ~52
            # targets, so at most that many distinct titles exist), but
            # asserted rather than assumed.
            if [ "$(jq -r 'length' <<<"$listing")" -ge "$ISSUE_PAGE_LIMIT" ]; then
              echo "WARNING: open fuzz-failure issues hit the ${ISSUE_PAGE_LIMIT} page limit —"
              echo "         dedup may miss a match and file a duplicate. Triage the backlog."
            fi

            # The title reaches jq through the environment, not the
            # filter string, so a target name cannot break the quoting.
            existing="$(TITLE="$title" jq -r \
              'map(select(.title == env.TITLE)) | .[0].number // empty' <<<"$listing")"

            # One target's filing must not swallow the rest: a transient
            # API error on the first of three crashes would otherwise
            # lose the other two with the run already marked failed, and
            # nothing re-runs it until next Monday.
            if [ -n "$existing" ]; then
              echo "Recurrence of ${title} — commenting on #${existing}"
              gh issue comment "$existing" --body-file issue-body.md || {
                echo "WARNING: failed to comment on #${existing} for ${title}"
                file_failures=$((file_failures + 1))
              }
            else
              echo "New failure ${title} — filing an issue"
              gh issue create \
                --title "$title" \
                --label fuzz-failure \
                --body-file issue-body.md || {
                echo "WARNING: failed to file an issue for ${title}"
                file_failures=$((file_failures + 1))
              }
            fi
          # `read` returns non-zero on a final line with no trailing
          # newline and bash discards it, so a summary written with printf
          # would silently lose its LAST row — always the same
          # alphabetically-last target, at exit 0. The appended newline
          # means we don't rely on the producer terminating the file.
          done < <(sed -E 's/ \[([^]]*)\]$/ \1/' fuzz-failures.txt; printf '\n')

          if [ "$file_failures" -gt 0 ]; then
            echo "ERROR: ${file_failures} target(s) could not be filed — see warnings above."
            exit 1
          fi
