name: Fuzz Sweep

# Weekly sweep over every fuzz target in the repo (the per-PR fuzz job
# in ci.yml runs only a 3-target smoke). Targets are discovered by
# scripts/fuzz-all.sh, so new Fuzz* functions are swept automatically.
#
# On failure: the crashing inputs are uploaded as an artifact and one
# GitHub issue is filed per failing target, so findings don't silently
# rot in the Actions tab. A target that fails again while its issue is
# still open gets a comment there instead of a duplicate issue.
#
# Note: the pgstore fuzz targets self-skip without
# RELA_TEST_DATABASE_URL; wiring a postgres service into this sweep is
# a known follow-up.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, before the weekly security scan
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz-sweep:
    name: Fuzz all targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Run all fuzz targets
        run: FUZZTIME=25s scripts/fuzz-all.sh

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failing-inputs
          path: |
            internal/**/testdata/fuzz/**
            fuzz-failures.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: File a fuzz-failure issue per failing target
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Config/setup errors (script exit 2 — bad FUZZTIME, broken
          # build, zero targets) produce no summary file and should fail
          # the run without filing a "fuzz found a bug" issue.
          if [ ! -f fuzz-failures.txt ]; then
            echo "No target-failure summary — setup error, not filing an issue."
            exit 0
          fi
          gh label create fuzz-failure \
            --description "Filed automatically by the weekly fuzz sweep" \
            --color D93F0B --force

          # One issue per failing target, not one issue per sweep: a
          # sweep that finds three unrelated crashes is three bugs, and
          # each needs its own fix, assignee and close. Identity is the
          # (package, target) pair, carried in the title and matched
          # exactly on the next sweep — so a recurrence comments on its
          # own issue and a newly broken target opens a fresh one.
          file_failures=0
          while read -r pkg target kind; do
            [ -n "${target:-}" ] || continue
            title="Fuzz failure: ${target} (${pkg#./})"

            {
              echo "The weekly fuzz sweep failed this target."
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Package | \`${pkg}\` |"
              echo "| Target | \`${target}\` |"
              echo "| Kind | \`${kind}\` |"
              echo ""
              case "$kind" in
                *fuzz-crash*)
                  echo "\`fuzz-crash\` means a crashing input was found."
                  ;;
                *)
                  echo "\`error\` means the target failed for an infrastructure reason,"
                  echo "e.g. a seed-corpus regression — not necessarily a new crashing input."
                  ;;
              esac
              echo ""
              echo "Run: ${RUN_URL}"
              echo ""
              echo "The crashing inputs are attached to the run as the **fuzz-failing-inputs** artifact."
              echo "To reproduce locally: copy the artifact's \`testdata/fuzz/${target}/\` files into"
              echo "\`${pkg}\`, then \`go test -run='^${target}\$' ${pkg}\` — the failing input now runs"
              echo "as a regular regression test. Once fixed, commit the input as a seed."
            } > issue-body.md

            # Exact-title match among open fuzz-failure issues — a
            # prefix/fuzzy match would alias two targets onto one issue.
            # The title goes through the environment because gh's --jq
            # takes no --arg, and interpolating it into the filter would
            # let a target name break out of the quoting.
            existing="$(TITLE="$title" gh issue list --label fuzz-failure \
              --state open --limit 200 --json number,title \
              --jq 'map(select(.title == env.TITLE)) | .[0].number // empty' || true)"

            # One target's filing must not swallow the rest: a transient
            # API error on the first of three crashes would otherwise
            # lose the other two with the run already marked failed, and
            # nothing re-runs it until next Monday.
            if [ -n "$existing" ]; then
              echo "Recurrence of ${title} — commenting on #${existing}"
              gh issue comment "$existing" --body-file issue-body.md || {
                echo "WARNING: failed to comment on #${existing} for ${title}"
                file_failures=$((file_failures + 1))
              }
            else
              echo "New failure ${title} — filing an issue"
              gh issue create \
                --title "$title" \
                --label fuzz-failure \
                --body-file issue-body.md || {
                echo "WARNING: failed to file an issue for ${title}"
                file_failures=$((file_failures + 1))
              }
            fi
          done < <(sed -E 's/\[([^]]*)\]/\1/' fuzz-failures.txt)

          if [ "$file_failures" -gt 0 ]; then
            echo "ERROR: ${file_failures} target(s) could not be filed — see warnings above."
            exit 1
          fi
