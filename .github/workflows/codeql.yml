name: CodeQL

on:
  push:
    branches: [develop]
  # No `branches:` filter — see the same note in ci.yml. The filter matched the
  # TARGET branch, so a PR stacked on a feature branch got no SAST at all, and
  # its check list looked clean because it was empty.
  pull_request:
  schedule:
    # Weekly fallback run (Monday 10:00 UTC). Complements the
    # push/PR triggers so even branches that don't reach develop get
    # periodic coverage.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
