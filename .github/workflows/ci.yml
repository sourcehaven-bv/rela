name: CI

on:
  push:
    branches: [main, develop]
  # No `branches:` filter on pull_request, deliberately. The filter matches the
  # TARGET branch, so a stacked PR (one opened against another feature branch
  # rather than develop) matched nothing and ran ZERO checks — while the PR page
  # showed no failures, which reads identically to "everything passed". A
  # security-relevant endpoint was reviewed that way before this was caught.
  # Every PR gets CI regardless of what it targets.
  pull_request:
  # Required for the merge queue: entries are tested on an ephemeral
  # `gh-readonly-queue/...` ref, and a required check that never runs there
  # leaves the entry queued forever. Every check listed as required on
  # develop must therefore also report on merge_group.
  merge_group:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test
    # 26.04, not ubuntu-latest: the command sandbox needs unprivileged user
    # namespaces, which 24.04 restricts via AppArmor
    # (apparmor_restrict_unprivileged_userns=1, seen as bwrap "Failed
    # RTM_NEWADDR: Operation not permitted"). 26.04 does not ship that
    # restriction, so bwrap works without any sysctl override.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Download dependencies
        run: go mod download

      # External commands (attachment scan/transform, view export) run confined
      # and FAIL CLOSED when no sandbox is available, so the runner needs
      # bubblewrap or every command-running test fails. Installing it also means
      # CI exercises the real sandbox — including the negative tests that assert
      # egress and out-of-allowlist reads are actually blocked, which otherwise
      # skip and would let a broken profile ship unnoticed.
      - name: Install bubblewrap (command sandbox)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Verify the sandbox actually works on this runner
        # A hard failure here is better than every sandbox test silently
        # skipping: it means the confinement CI thinks it is testing is absent.
        run: bwrap --unshare-all --ro-bind / / /bin/true

      - name: Run tests
        # -shuffle=on randomizes test order to surface inter-test ordering
        # dependencies; the seed is printed on failure for reproduction.
        run: go test -v -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage thresholds
        uses: vladopajic/go-test-coverage@v2.19.0
        with:
          config: .testcoverage.yml
          github-action-output: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out

  vulncheck:
    name: Vulnerability Check
    # Only gate PRs that touch Go dependencies. Non-dep PRs get their vuln signal
    # from the weekly schedule in security.yml, which auto-opens an update PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect go.mod / go.sum changes
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — running vulncheck."
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE_SHA"...HEAD -- go.mod go.sum | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "go.mod or go.sum changed — running vulncheck."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dep changes — skipping (weekly schedule covers this)."
          fi

      - name: Set up Go
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Run govulncheck
        if: steps.detect.outputs.changed == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          ./scripts/govulncheck-filtered.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Install golangci-lint
        # Build from source against the active Go toolchain so the linter can
        # analyse our code regardless of the go.mod toolchain directive.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Run golangci-lint
        run: golangci-lint run ./...

  arch-lint:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Install go-arch-lint
        # Keep in sync with go_arch_lint_version in the justfile.
        run: go install github.com/fe3dback/go-arch-lint@v1.15.0

      - name: Check architecture
        run: go-arch-lint check

  plimsoll:
    name: God-object lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Install plimsoll
        # Keep in sync with plimsoll_version in the justfile.
        run: go install github.com/sourcehaven-bv/plimsoll/cmd/plimsoll@v0.2.0

      - name: Check type load lines
        run: plimsoll ./...

  comment-lint:
    name: Comment lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Install commentlint
        # Keep in sync with commentlint_version in the justfile.
        run: go install github.com/sourcehaven-bv/commentlint@v0.2.0

      # Gate: clean today, so a regression fails the build. Rules are promoted
      # here from the advisory step once their backlog reaches zero.
      - name: Check comments (gate)
        run: commentlint -rules commented-code ./internal ./cmd

      # Advisory: real findings with a backlog being worked down. Visible in
      # the log, never red — see .commentlint.yml for why each rule is here.
      - name: Comment report (advisory)
        continue-on-error: true
        run: commentlint -rank -top 30 ./internal ./cmd

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"

      - name: Check audit-log retention docs (>= 12 months; issue #887)
        run: ./scripts/check-audit-retention-docs.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Work tree clean after build
        # Whole-repo tripwire: fails when any step of this job modified
        # tracked files or left untracked files behind (e.g. the vue-tsc
        # artifacts that once shadowed vite.config.ts, BUG-P0DZA5).
        run: |
          DIRTY=$(git status --porcelain --untracked-files=all)
          if [ -n "$DIRTY" ]; then
            echo "Repo not clean after build:"
            echo "$DIRTY"
            exit 1
          fi

  e2e:
    name: E2E
    # 26.04, not ubuntu-latest — same reason as the `test` job above: the
    # command sandbox needs unprivileged user namespaces, which earlier images
    # restrict via AppArmor. This job only started needing a working sandbox
    # when document `command:` renderers moved off `sh -c` onto cmdexec
    # (TKT-QGHNVA), which fails closed rather than running unconfined.
    runs-on: ubuntu-26.04
    # A postgres service backs the pgstore-only e2e specs (relation/entity
    # content history). The default fsstore specs ignore it; the postgres specs
    # skip when RELA_E2E_DATABASE_URL is unset, so this is what turns them on.
    env:
      RELA_E2E_DATABASE_URL: postgres://rela@127.0.0.1:5432/rela_e2e?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rela
          POSTGRES_DB: rela_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      # Document `command:` renderers run confined via internal/cmdexec, which
      # FAILS CLOSED when no sandbox is available (TKT-QGHNVA moved them off
      # `sh -c`). Without bubblewrap the fixture documents never render and the
      # document specs fail. Same rationale as the `test` job above.
      - name: Install bubblewrap (command sandbox)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build rela-server (embeds E2E dev-mode frontend)
        # build:e2e produces a development-mode bundle (import.meta.env.DEV
        # === true) so DEV-guarded test hooks compile in for the E2E suite.
        # Release builds use the production `build`, which strips them (#890).
        # Also build the postgres-tagged server for the pgstore-only specs (the
        # fixture forbids in-fixture builds under CI, so both must exist here).
        run: |
          cd frontend && npm run build:e2e && cd ..
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/rela-server ./cmd/rela-server
          CGO_ENABLED=0 go build -tags postgres -trimpath -ldflags "-s -w" -o bin/rela-server-postgres ./cmd/rela-server

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Lint e2e (Page Object Pattern enforcement)
        working-directory: e2e
        run: npm run lint

      - name: Typecheck e2e
        working-directory: e2e
        run: npm run typecheck

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        # Short sweep cadence so the postgres relation-history spec sees
        # create/update version captures within seconds instead of the 5-minute
        # production default. Ignored by the fsstore specs.
        env:
          RELA_VERSION_SWEEP_INTERVAL: 500ms
          RELA_VERSION_SWEEP_IDLE: 150ms
          RELA_VERSION_SWEEP_MAX_STALENESS: 2s
        run: npx playwright test --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Run fuzz tests
        run: |
          # Run one fuzz target, failing ONLY on a real finding.
          #
          # Since Go 1.25, a `-fuzztime` budget that expires while a worker is
          # mid-execution exits non-zero with "context deadline exceeded"
          # instead of stopping cleanly. That is the timer doing its job, not a
          # bug in the code under test — but GitHub's default `bash -e` treats
          # it as a step failure, which made this job flake on slow runners
          # (observed twice in one afternoon on two different targets, at ~14k
          # execs/sec versus ~160k locally) and skip every target after the
          # first.
          #
          # Swallowing the timeout is only safe because a genuine finding leaves
          # different, unambiguous evidence: the target writes a reproducer
          # under testdata/fuzz/ and prints "Failing input written to". We fail
          # hard whenever that appears, so a real crash still breaks the build.
          #
          # Do NOT widen that grep to "--- FAIL": the timeout output contains
          # `--- FAIL: <target>` AND "context deadline exceeded" together, so
          # matching on it would re-fail exactly the case this exists to
          # tolerate. Order matters for the same reason — the crash check is a
          # positive match on reproducer evidence, not on generic failure.
          run_fuzz() {
            local target=$1 pkg=$2 out status
            echo "==> fuzzing $target in $pkg"
            set +e
            out=$(go test -run='^$' -fuzz="^${target}\$" -fuzztime=10s "$pkg" 2>&1)
            status=$?
            set -e
            echo "$out"
            if [ $status -eq 0 ]; then
              return 0
            fi
            if grep -q 'Failing input written to' <<<"$out"; then
              echo "::error::fuzz target $target found a failing input"
              return 1
            fi
            if grep -q 'context deadline exceeded' <<<"$out"; then
              echo "::notice::$target hit its time budget without a finding (slow runner); treating as pass"
              return 0
            fi
            echo "::error::fuzz target $target failed for an unrecognised reason (exit $status)"
            return 1
          }

          run_fuzz FuzzParseDocument ./internal/markdown/
          run_fuzz FuzzParseEntityID ./internal/entity/
          run_fuzz FuzzValidateID ./internal/entity/

  postgres:
    name: Postgres Backend
    runs-on: ubuntu-latest
    # The CI database is ephemeral and reachable only from this job's runner —
    # it holds no real data and is torn down with the runner. There is no
    # credential to protect, so the container uses trust auth (no password)
    # rather than a secret. This lets the job run everywhere, including
    # Dependabot and fork PRs where GitHub does not expose repository secrets
    # (a secret-sourced password resolved to empty there and the container
    # failed to start, failing CI on every dependency bump).
    env:
      POSTGRES_USER: rela
      POSTGRES_DB: rela_test
      # This job's entire purpose is proving the postgres backend matches the
      # default one, and the pgstore suite SKIPS itself when the DSN is absent
      # — a skip that is indistinguishable from a pass in the exit code and the
      # CI summary. Without this, a dropped env var or a renamed service
      # container silently turns the backend-parity gate into a no-op and
      # nothing goes red. Setting it makes the suite hard-fail instead of
      # skipping (see requireDBEnv in internal/store/pgstore/testdb_test.go).
      RELA_TEST_DATABASE_REQUIRED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rela
          POSTGRES_DB: rela_test
          # Throwaway, runner-local DB: no password, trust auth.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Wait for the server to accept connections before tests run.
        options: >-
          --health-cmd "pg_isready -U rela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # Trust auth: no password in the DSN. The DB is ephemeral and
      # runner-local, so there is no credential to keep out of the log.
      - name: Configure test database URL
        run: |
          printf 'RELA_TEST_DATABASE_URL=postgres://%s@127.0.0.1:5432/%s?sslmode=disable\n' \
            "$POSTGRES_USER" "$POSTGRES_DB" >> "$GITHUB_ENV"

      # The default build must NOT link pgx, and the postgres build must NOT
      # link bleve. These greps are the load-bearing assertions for the
      # "no bleve in the postgres build" acceptance criterion (TKT-M8400).
      - name: Assert dependency isolation
        run: |
          set -euo pipefail
          echo "default build must not link pgx:"
          ! go list -deps ./cmd/rela-server | grep -q 'jackc/pgx'
          ! go list -deps ./cmd/rela        | grep -q 'jackc/pgx'
          echo "postgres build must not link bleve:"
          ! go list -deps -tags postgres ./cmd/rela-server | grep -q 'blevesearch/bleve'
          ! go list -deps -tags postgres ./cmd/rela        | grep -q 'blevesearch/bleve'
          echo "only the default rela-docs links chromedp (screenshot{} browser capture):"
          ! go list -deps ./cmd/rela        | grep -q 'chromedp/chromedp'
          ! go list -deps ./cmd/rela-server | grep -q 'chromedp/chromedp'
          go list -deps ./cmd/rela-docs     | grep -q 'chromedp/chromedp'
          echo "the postgres rela-docs must NOT link chromedp (screenshot{} is disabled there):"
          ! go list -deps -tags postgres ./cmd/rela-docs | grep -q 'chromedp/chromedp'
          echo "OK: backends and the browser dependency are isolated."

      - name: Compile all backend build-tag combinations
        run: |
          go build ./...
          go build -tags memorybackend ./...
          go build -tags postgres ./...

      # RELA_TEST_DATABASE_REQUIRED (job env) makes the suite hard-fail rather
      # than skip if the DSN is missing. The grep below is the second, blunter
      # half of the same guard: it catches a suite that skipped for any OTHER
      # reason — a future build tag, a t.Skip added inside a subtest, a
      # conformance case quietly excluded — which the env var alone would not
      # notice. Both are cheap; the failure they prevent (silent backend
      # divergence) is not.
      - name: Run pgstore conformance + fuzz seeds (race) against PostgreSQL
        run: |
          set -euo pipefail
          go test -race -tags postgres -v ./internal/store/pgstore/... 2>&1 | tee pgstore-test.log
          if grep -q -- '--- SKIP' pgstore-test.log; then
            echo "::error::pgstore tests SKIPPED in the Postgres Backend job."
            echo "This job exists to prove backend parity; a skipped suite is not a pass."
            grep -- '--- SKIP' pgstore-test.log
            exit 1
          fi
          echo "OK: pgstore suite ran against PostgreSQL with no skips."

      # The step above covers the STORE under -tags postgres. Nothing covered
      # the WIRING: `internal/appbuild` and `internal/cli` were compiled with
      # the tag but never run with it, so every build-agnostic composition-root
      # test in them (Services fully populated, Close idempotent, acl.yaml
      # loaded, corrupt CalDAV cache non-fatal) silently regressed on the
      # postgres build and stayed invisible until someone ran the tagged suite
      # by hand.
      #
      # These are not backend tests — they assert wiring that must hold on
      # every backend — so they run against the same database rather than
      # being excluded. backendtest gives each one a private migrated schema.
      #
      # Skips are tolerated here, unlike the pgstore step: a few cases
      # deliberately assert boot failures that occur before any store opens and
      # legitimately need no database. RELA_TEST_DATABASE_REQUIRED (job env)
      # still turns a MISSING DSN into a hard failure, which is the regression
      # that actually matters.
      #
      # internal/cli is scoped to its wiring tests rather than run whole. The
      # package also holds render tests that shell out through internal/cmdexec,
      # which fails closed without a working sandbox — and bubblewrap cannot set
      # up its loopback device on this job's runner ("RTM_NEWADDR: Operation not
      # permitted"), even with the package installed, unlike the `test` job.
      # Those tests are backend-independent and already covered there; running
      # them here would gate the postgres wiring on an unrelated sandbox
      # capability. The `test` job remains the owner of full-package coverage.
      - name: Run composition-root wiring tests against PostgreSQL
        run: |
          set -euo pipefail
          go test -race -tags postgres ./internal/appbuild/...
          go test -race -tags postgres -run 'TestNewMCPServices|TestMCPServices|TestMCPWatcher' \
            ./internal/cli/

  # Cross-compile every (GOOS, build-tag) combination GoReleaser ships so a
  # platform-specific compile break (e.g. a unix-only syscall used without a
  # build-tagged fallback) fails here at PR time instead of silently at
  # release time, where it leaves an empty GitHub release. The default-runner
  # builds in `postgres` only exercise linux; this job adds darwin + windows.
  # Keep the goos/tag matrix in sync with .goreleaser.yaml's builds.
  cross-compile:
    name: Cross-Compile (${{ matrix.goos }}/${{ matrix.tags || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        tags: ["", "postgres"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # CGO off matches the GoReleaser builds for rela / rela-server; this is a
      # pure cross-compile, so no per-OS C toolchain is needed.
      - name: Build rela + rela-server + rela-docs
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          set -euo pipefail
          flags=""
          [ -n "$BUILD_TAGS" ] && flags="-tags $BUILD_TAGS"
          echo "Building GOOS=$GOOS ${flags:-(default)}"
          go build $flags ./cmd/rela ./cmd/rela-server ./cmd/rela-docs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, vulncheck, lint, arch-lint, plimsoll, lint-markdown, fuzz, postgres, cross-compile, frontend, e2e]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # Compile-only gate. Release binaries come from GoReleaser in
      # release.yml, so there is no artifact to upload here — a per-run copy
      # was retained for 90 days and never downloaded.
      - name: Build
        run: go build -o bin/rela ./cmd/rela

  rela-tickets:
    name: Rela Tickets
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the ticket gate applies
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Two independent switches:
          #   applies      — run the ticket gate at all (validation + done-check).
          #   require_new  — additionally require this PR to add/modify a ticket.
          #
          # dependabot PRs are fully exempt (bot dependency bumps carry no ticket).
          # chore/* PRs are NOT exempt from validation anymore: they still get the
          # `validate` + done-check steps (this is the hole TKT-QXHFJZ slipped
          # through — a chore branch merged a stale `ready` ticket). They are only
          # exempt from the "must reference a ticket" requirement, since a pure
          # chore may legitimately touch no ticket.
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "merge_group" ]]; then
            # Post-merge safety net, and the merge-queue check.
            #
            # push: the PR-time gate can only see the PR's own diff, so a rule
            # that starts failing because of what ALREADY landed (or because a
            # rule/entity elsewhere changed) reaches develop unnoticed and then
            # fails the next unrelated PR. Validating on push pins the blame to
            # the merge that actually broke it.
            #
            # merge_group: this is the last gate before the commit lands, run
            # against the queued combination rather than the PR in isolation —
            # exactly where a cross-PR ticket conflict shows up. Reporting a
            # hollow success here would make the queue's guarantee worthless.
            #
            # Neither has a ticket to add, so `require_new` stays false.
            echo "applies=true" >> "$GITHUB_OUTPUT"
            echo "require_new=false" >> "$GITHUB_OUTPUT"
            echo "$EVENT_NAME on ${GITHUB_REF_NAME:-?}: validating tickets."
          elif [[ "$EVENT_NAME" != "pull_request" ]] \
             || [[ "$HEAD_REF" == dependabot/* ]]; then
            echo "applies=false" >> "$GITHUB_OUTPUT"
            echo "require_new=false" >> "$GITHUB_OUTPUT"
            echo "Ticket gate does not apply for $EVENT_NAME / $HEAD_REF; reporting success."
          elif [[ "$HEAD_REF" == chore/* ]]; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
            echo "require_new=false" >> "$GITHUB_OUTPUT"
            echo "chore/* branch: validating tickets but not requiring a new/modified ticket."
          else
            echo "applies=true" >> "$GITHUB_OUTPUT"
            echo "require_new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.applies == 'true'
        with:
          fetch-depth: 0

      - name: Set up Go
        if: steps.gate.outputs.applies == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Build rela
        if: steps.gate.outputs.applies == 'true'
        run: go build -o bin/rela ./cmd/rela

      - name: Check for new or modified work-item entity
        if: steps.gate.outputs.require_new == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Get list of added or modified entity files in this PR
          # A = Added (new tickets), M = Modified (continuation work on existing tickets)
          #
          # Any work-item entity counts, not just bugs/features/tickets: flipping a
          # review-response to `addressed` or closing out a doc-task is exactly the
          # ticket hygiene this gate wants, and failing it for touching the "wrong"
          # entity subdirectory taught people to bolt a no-op ticket edit onto the PR.
          # Reference material (concepts, decisions, ideas, guides) is deliberately
          # NOT here — editing a concept is not evidence of tracked work.
          CHANGED_ENTITIES=$(git diff --name-only --diff-filter=AM "${BASE_SHA}"...HEAD -- \
            'tickets/entities/bugs/*.md' \
            'tickets/entities/features/*.md' \
            'tickets/entities/tickets/*.md' \
            'tickets/entities/researchs/*.md' \
            'tickets/entities/review-responses/*.md' \
            'tickets/entities/doc-tasks/*.md' \
            'tickets/entities/bug-analysis-checklists/*.md' \
            'tickets/entities/implementation-checklists/*.md' \
            'tickets/entities/planning-checklists/*.md' \
            'tickets/entities/review-checklists/*.md' \
            'tickets/entities/docs-checklists/*.md' || true)

          # A code-only PR may carry its tickets on a companion branch (so the code
          # PR is reviewable as code, and the ticket PR merges when the work actually
          # reaches a terminal state). Such a PR declares the companion explicitly.
          TICKETS_PR=""
          if [[ -n "${PR_BODY:-}" ]]; then
            TICKETS_PR=$(printf '%s' "$PR_BODY" \
              | grep -oiE 'Tickets-PR:[[:space:]]*#?[0-9]+' \
              | head -1 | grep -oE '[0-9]+' || true)
          fi

          if [[ -z "$CHANGED_ENTITIES" && -n "$TICKETS_PR" ]]; then
            echo "No work-item entity in this PR, but it declares its tickets live in #${TICKETS_PR}."
            echo "Ticket state is gated on that PR; this one is code-only."
            exit 0
          fi

          if [[ -z "$CHANGED_ENTITIES" ]]; then
            echo ""
            echo "ERROR: PR must include a new or modified work-item entity in tickets/entities/"
            echo ""
            echo "Create one with:"
            echo "  rela create bug --project tickets -P title='Title'"
            echo "  rela create feature --project tickets -P title='Title'"
            echo "  rela create ticket --project tickets -P title='Title'"
            echo ""
            echo "Or, if this PR is code-only and its tickets live on a companion"
            echo "branch, add a line to the PR body:"
            echo "  Tickets-PR: #1234"
            exit 1
          fi

          echo "Found work-item entities:"
          echo "$CHANGED_ENTITIES"

      - name: Entities all parse
        if: steps.gate.outputs.applies == 'true'
        run: |
          set -euo pipefail
          cd tickets

          # An entity whose frontmatter does not parse is SKIPPED by the store
          # rather than failing it: the loader logs the error and carries on, so
          # `rela validate` then happily reports success over a graph that is
          # quietly missing entities. That is not hypothetical — it is how the
          # 10 violations this guard was written for reached develop (#1338
          # logged the warning and passed). Every workflow gate is only as
          # strong as the parser feeding it, so fail loudly on any parse error
          # before trusting a single validation result.
          echo "Checking every entity parses..."
          if ! err=$(../bin/rela list 2>&1 >/dev/null); then
            echo "$err"
            echo ""
            echo "ERROR: rela could not list entities."
            exit 1
          fi

          if printf '%s' "$err" | grep -q "failed to parse frontmatter"; then
            echo "$err"
            echo ""
            echo "ERROR: some entities have unparseable frontmatter."
            echo ""
            echo "These entities are SILENTLY SKIPPED by validation, so the"
            echo "checks below would pass while not actually checking them."
            echo "Fix the YAML before relying on any validation result."
            echo ""
            echo "Most common cause: an unquoted scalar containing ': ' or"
            echo "starting with a character YAML treats specially. Quote it:"
            echo "  title: 'Something: with a colon'"
            exit 1
          fi

          echo "✓ All entities parse."

      - name: Run rela validate
        if: steps.gate.outputs.applies == 'true'
        run: |
          set -euo pipefail
          cd tickets

          echo "Running validation checks..."
          ../bin/rela validate --check cardinality --check properties --check validations

          echo ""
          echo "All rela checks passed!"

      # PR-only: it diffs against the PR base to find what THIS PR touched.
      # On push that base does not exist, and the question is meaningless
      # anyway — the merge already happened.
      - name: Ticket done-before-merge check
        if: steps.gate.outputs.applies == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Any ticket/bug touched by this PR must be brought to a terminal
          # state (done / wont-fix / blocked), not left mid-flight or parked in
          # `ready`. The `ci-no-*` validation rules already block planning /
          # in-progress / review / analyzing / blocked; this catches the
          # remaining hole: a work item left in `ready` while its code merges
          # (how TKT-QXHFJZ shipped stale). backlog is allowed (untouched work).
          CHANGED=$(git diff --name-only --diff-filter=AM "${BASE_SHA}"...HEAD -- \
            'tickets/entities/bugs/*.md' \
            'tickets/entities/tickets/*.md' || true)

          # Read a frontmatter scalar: only scan between the first two `---`
          # fences so a `status:`/`id:` mention in the markdown body can't be
          # picked up.
          fm_field() {
            awk -v key="$2" '
              /^---[[:space:]]*$/ { fence++; if (fence == 2) exit; next }
              fence == 1 && $0 ~ "^" key ":" {
                sub("^" key ":[[:space:]]*", ""); gsub(/["\x27]/, "");
                print; exit
              }' "$1"
          }

          FAIL=0
          for f in $CHANGED; do
            [[ -f "$f" ]] || continue
            STATUS=$(fm_field "$f" status)
            ID=$(fm_field "$f" id)
            case "$STATUS" in
              done|wont-fix|blocked|backlog) ;;
              ready)
                echo "ERROR: $ID is '$STATUS' — finish it (status=done) before merging its PR, or move it back to backlog."
                FAIL=1
                ;;
              *)
                # planning/in-progress/review/analyzing are caught by ci-no-* rules;
                # flag here too for a clear message.
                echo "ERROR: $ID is '$STATUS' — not a mergeable terminal state."
                FAIL=1
                ;;
            esac
          done
          exit $FAIL

  demos:
    name: Demos
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Build rela
        run: go build -o bin/rela ./cmd/rela

      - name: Run demo scripts
        run: |
          set -euo pipefail
          # Skyward demos chain off setup; run it first if present.
          if [ -x scripts/setup-skyward-demo.sh ]; then
            echo "==> scripts/setup-skyward-demo.sh"
            scripts/setup-skyward-demo.sh
          fi
          shopt -s nullglob
          for demo in scripts/demo-*.sh; do
            echo ""
            echo "==> ${demo}"
            "${demo}"
          done

      - name: Run shell-level e2e tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          for e2e in scripts/e2e-*.sh; do
            echo ""
            echo "==> ${e2e}"
            "${e2e}"
          done

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Build rela
        run: go build -o bin/rela ./cmd/rela

      - name: Generate docs
        run: ./scripts/generate-docs.sh

      - name: Check docs are up to date
        run: |
          git diff --exit-code docs/ README.md || \
            (echo "" && \
             echo "ERROR: docs/ or README.md is out of date with docs-project/ entities." && \
             echo "Run 'just docs' locally and commit the changes." && \
             echo "" && \
             echo "Changed files:" && \
             git diff --name-only docs/ README.md && \
             exit 1)
