name: Tag Release

# Manually-triggered release cutter. Computes the next CalVer tag
# (vYY.M.BUILD — see scripts/generate-version-tag.sh) and pushes it from the
# chosen branch (default: develop). Pushing the tag triggers the Release
# workflow, which builds artifacts and creates the GitHub release. This exists
# so nobody hand-creates a release object in the UI before the tag — the
# mistake that left v0.8 / v0.12 as empty, published-looking releases with zero
# assets. See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to tag"
        required: true
        default: develop
      alpha:
        description: "Mark as a prerelease (-alpha suffix)"
        type: boolean
        default: false
      dry_run:
        description: "Compute the next tag but do not push it"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tag:
    name: Push next release tag
    runs-on: ubuntu-latest
    steps:
      # A tag pushed with the default GITHUB_TOKEN does NOT fire `on: push`,
      # so the Release workflow would never start. Pushing with a GitHub App
      # token does fire it. rela already uses this app for security.yml and
      # dependabot-auto-merge.yml — same APP_ID / APP_PRIVATE_KEY secrets.
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute next tag
        id: next
        env:
          ALPHA: ${{ inputs.alpha }}
        run: |
          set -euo pipefail
          if [ "$ALPHA" = "true" ]; then
            next="$(./scripts/generate-version-tag.sh --alpha)"
          else
            next="$(./scripts/generate-version-tag.sh)"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next tag: $next"

      - name: Refuse if tag already exists
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "Tag $NEXT already exists; aborting." >&2
            exit 1
          fi

      # The checkout above is authenticated with the app token, so this push
      # carries it too and the Release workflow triggers on the tag push.
      - name: Push tag
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"
          echo "Pushed $NEXT — the Release workflow will build and publish it."

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          echo "Dry run: would have pushed $NEXT (not pushed)."

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.next.outputs.next }}
          REF: ${{ inputs.ref }}
          ALPHA: ${{ inputs.alpha }}
        run: |
          {
            echo "### Release tagged :rocket:"
            echo ""
            echo "**Version:** \`$NEXT\`"
            echo "**Ref:** \`$REF\`"
            echo "**Prerelease:** $ALPHA"
            echo ""
            echo "The Release workflow builds the artifacts and publishes the release."
          } >> "$GITHUB_STEP_SUMMARY"
