<!--
  Opts the preview iframe into the full screen, so `env(safe-area-inset-*)`
  reports the notch and the home indicator rather than zero. Consuming apps
  need the same `viewport-fit=cover` on their own viewport meta for the
  components' safe-area padding to do anything.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
