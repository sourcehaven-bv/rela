version: '1.0'

types:
  note_status:
    values: [open, done]
    default: open

entities:
  note:
    label: Note
    id_type: sequential
    id_prefix: NOTE
    properties:
      title:
        type: string
        required: true
      status:
        type: note_status
      summary:
        type: string
  # Written only by the contract test, outside the requests it compares. The
  # flush that reports a marker write reports, or follows, every earlier write.
  marker:
    label: Marker
    id_type: sequential
    id_prefix: MARK
    properties:
      title:
        type: string
