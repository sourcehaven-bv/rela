version: 1
limits:
  post_rate: 20/m
  page_limit: 100
channel_types:
  breach-response:
    label: Breach response
    attach_to: [datalek]
    roles:
      lead:   { label: the incident lead, from: entity.owner }
      member: { from: attached }
      dpo:    { label: the privacy officer, permission: privacy.officer }
    message_types:
      text:      { properties: { body: { type: markdown, required: true } }, post: [member] }
      contained: { properties: { note: { type: markdown } }, post: [lead, member] }
      assessed:  { properties: { risk: { type: risk-level, required: true } }, post: [lead, dpo] }
      notified:  { properties: { reference: { type: string, required: true } }, post: [dpo] }
      dismiss:   { properties: { reason: { type: string, required: true } }, post: [lead] }
      escalated: { properties: { note: { type: string } }, post: [lead] }
      reminder:         { properties: { body: { type: markdown, required: true } }, post: [lead] }
      escalate-stalled: { properties: { note: { type: string } }, post: [dpo] }
      handoff:          { properties: { to: { type: ref, to: [risico], required: true } }, post: [lead] }
      accept-handoff:   { properties: { note: { type: string } }, post: [lead] }
      claim:            { properties: { note: { type: string } }, post: [member] }
    session:
      label: GDPR breach response
      initial: detected
      on_final: close
      run_as: system:breach-bot
      states:
        detected:
          label: Detected
          on:
            contained:
              to: contained
              roles: [lead]
              outputs:
                - create:
                    type: timeline-entry
                    properties:
                      title: "Contained by {{message.author}}: {{message.note}}"
                      at: "{{now}}"
                    relate: { type: about }
            dismiss:   { to: dismissed }
            escalated: { to: contained, by: trigger }
          after:
            no-containment: { period: 24h, to: overdue, label: Not contained within a day }
        contained:
          label: Contained
          waiting_for: [lead]
          on:
            assessed:
              to: assessed
              roles: [lead]
              when: "message.risk ~= 'none'"
              outputs:
                - set: { properties: { risk: "{{message.risk}}" } }
            escalate-stalled: { to: overdue, when: "session.reminders['status-update'] >= 3" }
            handoff:
              to: handed-over
              roles: [lead]
              outputs:
                - set: { properties: { owner: "{{message.to}}" } }
          after:
            notify-deadline:
              period: 72h
              since: session
              to: overdue
              label: 72 hours since detection
              outputs:
                - set: { properties: { escalated: true } }
        handed-over:
          label: Handed over
          waiting_for: [lead]
          on:
            accept-handoff: { to: contained, roles: [lead] }
            claim:
              to: contained
              roles: [member]
              outputs:
                - set: { properties: { owner: "{{message.author}}" } }
          after:
            notify-deadline:
              period: 72h
              since: session
              to: overdue
              label: 72 hours since detection
              outputs:
                - set: { properties: { escalated: true } }
        assessed:
          label: Risk assessed
          on:
            notified:
              to: notified
              roles: [dpo]
              outputs:
                - set: { properties: { status: notified, reference: "{{message.reference}}" } }
          after:
            notify-deadline:
              period: 72h
              since: session
              to: overdue
              label: 72 hours since detection
              outputs:
                - set: { properties: { escalated: true } }
        overdue:
          label: Notification overdue
          on:
            notified:
              to: notified
              roles: [dpo]
              outputs:
                - set: { properties: { status: notified, reference: "{{message.reference}}" } }
        notified:  { label: AP notified, final: true }
        dismissed: { label: Dismissed, final: true, status: cancelled }
      reminders:
        status-update:
          label: Status update
          in: [detected, contained, handed-over, assessed, overdue]
          every: 30m
          first: 10m
          max: 48
          post:
            type: reminder
            props: { body: "Post a status update: what changed since the last one?" }
  incident-room:
    label: Incident room
    attach_to: [datalek, incident]
    cardinality: one
    read: { from: attached, label: Anyone who can read the breach }
    roles:
      lead:   { from: entity.owner, label: the incident lead }
      dpo:    { permission: privacy.officer, label: the privacy officer }
      member: { from: attached }
      agent:  { principal_type: agent }
    message_types:
      text:
        label: Message
        properties: { body: { type: markdown, required: true, max: 8000 } }
        post: [lead, dpo, member, agent]
      status-update:
        persist: log
        properties:
          severity: { type: severity }
          summary:  { type: string, required: true }
          affects:  { type: ref, to: [maatregel, risico] }
        when: "message.severity ~= ''"
        post: [lead]
        actions:
          log: { roles: [lead], promote_to: { type: timeline-entry, map: { title: summary }, relate: { type: about } } }
          accept: { label: Accept, permission: incident.decide,
                    denied: Only the lead can decide, promote_to: { type: decision } }
      typing: { persist: ephemeral, ttl: 5s, rate: 1/s, post: [lead, dpo, member, agent] }
    lifecycle:
      close:   { roles: [lead], condition: "entity.status == 'closed'", denied: "Close the breach first",
                 auto: { when: "entity.status == 'closed'" } }
      reopen:  { roles: [lead, dpo] }
      archive: { label: Archive the room, roles: [lead], from: closed, auto: { after: 30d } }
      delete:  { permission: records.delete, from: archived, retention: 7y }
    message_ops:
      edit_own:   { roles: [lead, dpo, member, agent], within: 15m }
      delete_own: { roles: [lead, dpo, member], from: open }
      remove:     { roles: [lead], reason_required: true }
    on_entity_delete: block
    detached_retention: 90d
  page-threads:
    attach_to: [page]
    anchor: face
    cardinality: many
    create: { label: New thread, roles: [editor] }
    typing: true
    roles:
      editor:  { permission: privacy.officer }
      starter: { creator: true }
    message_types:
      text:
        properties: { body: { type: string, required: true } }
        post: [editor, starter]
triggers:
  breach-escalated:
    entity_type: datalek
    on: enter
    when: "entity.severity == 'high' and days_between(entity.due, today()) < 3"
    channel: incident-room
    post: { type: status-update, props: { summary: "Severity raised to high", severity: high } }
