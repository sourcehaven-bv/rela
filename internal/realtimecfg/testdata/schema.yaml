version: "1.0"
types:
  severity:
    values: [low, medium, high]
  risk-level:
    values: [none, low, high]
entities:
  datalek:
    label: Data breach
    id_prefix: DL
    aliases: [breach]
    properties:
      title: {type: string}
      owner: {type: string}
      status: {type: string}
      severity: {type: severity}
      notes: {type: string}
      due: {type: date}
      count: {type: integer}
      risk: {type: risk-level}
      reference: {type: string}
      evidence: {type: file}
      ticket: {type: external_ref, system: jira}
      escalated: {type: boolean}
  incident:
    label: Incident
    id_prefix: INC
    properties:
      title: {type: string}
      owner: {type: string}
      status: {type: string}
      severity: {type: severity}
      due: {type: datetime}
  risico:
    label: Risk
    id_prefix: RISK
    properties:
      title: {type: string}
      owner: {type: string}
  maatregel:
    label: Measure
    id_prefix: MEA
    properties:
      title: {type: string}
  timeline-entry:
    label: Timeline entry
    id_prefix: TL
    properties:
      title: {type: string}
      at: {type: datetime}
  decision:
    label: Decision
    id_prefix: DEC
    properties:
      title: {type: string}
  handbook:
    label: Handbook
    id_type: manual
    properties:
      title: {type: string}
  memo:
    label: Memo
    id_prefix: MEMO
    properties:
      title: {type: string, required: true}
      level: {type: integer}
      double: {type: integer, computed: entity.level * 2}
      kind: {type: string, required: true, default: note}
    faces:
      published: {}
      draft: {}
  page:
    label: Page
    id_prefix: PAGE
    properties:
      title: {type: string}
      owner: {type: string}
    faces:
      published: {}
      draft: {}
relations:
  about:
    label: about
    from: [timeline-entry]
    to: [datalek, incident]
