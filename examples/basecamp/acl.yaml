# Basecamp sync: the connector's role. Merge it into your acl.yaml.
# `run_as` grants nothing by itself; this role is what the connector may do.
roles:
  basecamp-connector:
    read: [todo, todolist, project]
    create: [todo, todolist, project]
    update: [todo, todolist, project]
    # Moves the sync/basecamp version tags, and relinks a to-do or list
    # that moved in Basecamp without being allowed to delete either.
    permissions: ["tag:sync", basecamp-links]
# The links follow Basecamp, so the connector replaces them.
relation_grants:
  in-list:
    permission: basecamp-links
  in-project:
    permission: basecamp-links
assignments:
  integration:basecamp: basecamp-connector
