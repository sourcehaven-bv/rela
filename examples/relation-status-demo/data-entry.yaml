app:
  title: Status-demo
forms:
  taak:
    entity_type: taak
    title: Taak
    fields:
      - property: titel
    relations:
      - relation: heeft_status
        label: Status
  initiatief:
    entity_type: initiatief
    title: Initiatief
    fields:
      - property: titel
    relations:
      - relation: biedt_status
        label: Kolommen
        widget: cards
  status:
    entity_type: status
    title: Status
    fields:
      - property: titel
      - property: volgorde
      - property: categorie
      - property: beschrijving
lists:
  initiatieven:
    entity_type: initiatief
    title: Initiatieven
    columns:
      - property: titel
  statussen:
    entity_type: status
    title: Statussen
    columns:
      - property: titel
      - property: volgorde
      - property: categorie
    default_sort:
      - property: volgorde
  taken:
    entity_type: taak
    title: Taken per status
    columns:
      - property: titel
      - relation: heeft_status
        label: Status
      - relation: bestaat_uit
        direction: incoming
        label: Initiatief
    group_by:
      relation: heeft_status
      order_by: volgorde
    create_form: taak
    edit_form: taak
  initiatief_taken:
    entity_type: taak
    title: Taken
    columns:
      - property: titel
    group_by:
      relation: heeft_status
      offered_by: biedt_status
      order_by: volgorde
    create_form: taak
    edit_form: taak
kanbans:
  initiatief_bord:
    entity_type: taak
    title: Bord
    columns_from:
      relation: heeft_status
      offered_by: biedt_status
      order_by: volgorde
    card:
      title: titel
    create_form: taak
    edit_form: taak
  alle_taken:
    entity_type: taak
    title: Alle taken
    columns_from:
      relation: heeft_status
      order_by: volgorde
    card:
      title: titel
    edit_form: taak
pages:
  initiatief:
    entity_type: initiatief
    label: Initiatief
    tabs:
      - { id: bord, label: Bord, kanban: initiatief_bord, scope: { relation: bestaat_uit, direction: outgoing } }
      - { id: lijst, label: Lijst, list: initiatief_taken, scope: { relation: bestaat_uit, direction: outgoing } }
navigation:
  - label: Initiatieven
    list: initiatieven
  - label: Alle taken
    kanban: alle_taken
  - label: Taken per status
    list: taken
  - label: Statussen
    list: statussen
