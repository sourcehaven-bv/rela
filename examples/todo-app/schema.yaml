# Personal to-do list app. See README.md.
version: "1.0"
types:
  todo_status:
    values: [open, completed, canceled]
    default: open
    initial: open
    transitions:
      - { from: open, to: completed, label: Complete }
      - { from: open, to: canceled, label: Cancel }
      - { from: completed, to: open, label: Reopen }
      - { from: canceled, to: open, label: Reopen }
  # The "when" choice without a date. A start date lives in start_date.
  when_list:
    values: [today, evening, anytime, someday]
    labels:
      today: Today
      evening: This Evening
      anytime: Anytime
      someday: Someday
entities:
  area:
    label: Area
    plural: areas
    id_prefix: ""
    id_type: manual
    display: title
    properties:
      title: { type: string, required: true }
  project:
    label: Project
    plural: projects
    id_prefix: "PRJ-"
    id_type: short
    display: title
    properties:
      title: { type: string, required: true }
      status: { type: todo_status }
      deadline: { type: date }
      completed_on: { type: date }
    query_scopes:
      active: "entity.status == 'open'"
  heading:
    label: Heading
    plural: headings
    id_prefix: "HD-"
    id_type: short
    display: title
    properties:
      title: { type: string, required: true }
  todo:
    label: To-do
    plural: to-dos
    id_prefix: "TD-"
    id_type: short
    display: title
    properties:
      title: { type: string, required: true }
      status: { type: todo_status }
      when: { type: when_list }
      start_date: { type: date }
      deadline: { type: date }
      completed_on: { type: date }
  tag:
    label: Tag
    plural: tags
    id_prefix: "TAG-"
    id_type: short
    display: title
    properties:
      title: { type: string, required: true }
relations:
  in_project:
    label: in project
    inverse: project_todos
    from: [todo]
    to: [project]
    max_outgoing: 1
    orderable: incoming
  in_area:
    label: in area
    inverse: area_items
    from: [todo, project]
    to: [area]
    max_outgoing: 1
    orderable: incoming
  has_heading:
    label: has heading
    from: [project]
    to: [heading]
    max_incoming: 1
    orderable: outgoing
  under_heading:
    label: under heading
    from: [todo]
    to: [heading]
    max_outgoing: 1
  tagged:
    label: tagged
    from: [todo, project]
    to: [tag]
