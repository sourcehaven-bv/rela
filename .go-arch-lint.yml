version: 3

allow:
  depOnAnyVendor: false
  deepScan: false

exclude:
  - internal/testutil
  - internal/store/storetest
  - internal/entitymanager/entitymanagertest
  - internal/tracer/tracertest
  - internal/visibility/visibilitytest
  - internal/state/statetest
  - internal/lock/locktest
  - internal/tokenstore/tokenstoretest
  - internal/jobs/jobstest
  - internal/mail/mailtest
  - internal/userstate/userstatetest
  - internal/comments/commentstest
  - internal/schedulerstate/schedulerstatetest
  - frontend
  - e2e
  - .claude
  # Build tooling, not application code. scripts/tagged_build_tags.go is
  # `//go:build ignore` and runs via `go run`, so it is outside the package
  # graph and has no component to belong to.
  - scripts
  # Diagnostic tooling (call tracer). Instrumented builds import it only
  # through a build overlay, never from committed application code.
  - tools
  # Gitignored local scratch (perf harnesses etc). CI never sees it, but the
  # linter scans the working tree, so a local run must not trip on it.
  - .ignored

excludeFiles:
  - "_test\\.go$"

# -- Components ----------------------------------------------------------
components:
  # Entry points
  cmdCli:           { in: cmd/rela }
  cmdServer:        { in: cmd/rela-server }
  cmdDocs:          { in: cmd/rela-docs }
  cmdDesktop:       { in: cmd/rela-desktop }
  cmdGenIcons:      { in: cmd/gen-icons }

  # CLI layer
  cli:              { in: internal/cli }
  docscli:          { in: internal/docscli }

  # Web / UI layer
  dataentry:        { in: internal/dataentry }
  dataentryconfig:  { in: internal/dataentryconfig }
  # The canonical icon table. A LEAF on purpose: cmd/gen-icons imports it and
  # generates code back into dataentryconfig, so keeping the data in a package
  # with no generated file means a broken generated file can never make the
  # generator that fixes it unbuildable.
  icondefs:         { in: internal/dataentryconfig/icondefs }
  conditionlint:    { in: internal/conditionlint }
  desktop:          { in: internal/desktop }
  docs:             { in: internal/docs }
  docscapture:      { in: internal/docscapture }
  dataentrywire:    { in: internal/dataentrywire }
  # desktop.yaml: native notifications and the Dock badge. Wails-free; the
  # desktop shell delivers what it reports.
  desktopnotify:    { in: internal/desktopnotify }

  # Server protocols
  mcp:              { in: internal/mcp }
  openapi:          { in: internal/openapi }

  # Application services
  app:              { in: internal/app }
  appbuild:         { in: internal/appbuild }
  appbuildtest:     { in: internal/appbuild/appbuildtest }
  backendtest:      { in: internal/appbuild/backendtest }
  tenant:           { in: internal/tenant }

  # Domain services
  analysis:         { in: internal/analysis }
  attachment:       { in: internal/attachment }
  cmdexec:          { in: internal/cmdexec }
  transform:        { in: internal/transform }
  autocascade:      { in: internal/autocascade }
  automation:       { in: internal/automation }
  calfeed:          { in: internal/calfeed }
  classification:   { in: internal/classification }
  mailrender:       { in: internal/mailrender }
  # HTML <-> markdown for sync connectors (TKT-LAMZ8F). A leaf like mailrender.
  htmlmd:           { in: internal/htmlmd }
  mailtemplate:     { in: internal/mailtemplate }
  caldavalias:      { in: internal/caldavalias }
  conflict:         { in: internal/conflict }
  computed:         { in: internal/computed }
  datamigration:    { in: internal/datamigration }
  filemigstate:     { in: internal/datamigration/filemigstate }
  memmigstate:      { in: internal/datamigration/memmigstate }
  pgmigstate:       { in: internal/datamigration/pgmigstate }
  sqlitemigstate:   { in: internal/datamigration/sqlitemigstate }
  migstatetest:     { in: internal/datamigration/migstatetest }
  entitymanager:    { in: internal/entitymanager }
  imgproc:          { in: internal/imgproc }
  importer:         { in: internal/importer }
  renametype:       { in: internal/renametype }
  mermaid:          { in: internal/mermaid }
  schema:           { in: internal/schema }
  templating:       { in: internal/templating }
  predicate:        { in: internal/predicate }
  predicatefns:     { in: internal/predicatefns }
  # The pure three-way merge behind Lua rela.sync.merge (TKT-SM20FG): no
  # I/O, reads the metamodel only to type the synced fields.
  syncmerge:        { in: internal/syncmerge }
  relresolve:       { in: internal/relresolve }
  statemachine:     { in: internal/statemachine }
  tracer:           { in: internal/tracer }
  validation:       { in: internal/validation }
  validationgraph:  { in: internal/validationgraph }
  validator:        { in: internal/validator }

  # Core domain
  entity:           { in: internal/entity }
  # API wire contract — the v1 data-entry API vocabulary. A pure leaf:
  # depends only on entity (+ dataentryconfig), NEVER on dataentry. Both the
  # data-entry server and a future native bridge consume it.
  apiwire:          { in: internal/apiwire/** }
  lua:              { in: internal/lua }
  jobs:             { in: internal/jobs }
  scheduler:        { in: internal/scheduler }
  script:           { in: internal/script }
  metamodel:        { in: internal/metamodel }
  # Compiles the metamodel's `worlds:` into metamodel-FREE store.WorldScope
  # values. The one place that knows both vocabularies, so that stores and
  # visibility (neither of which may import metamodel) can hold the result.
  worlds:           { in: internal/worlds }
  queryscopes:      { in: internal/scopes }
  worldreader:      { in: internal/worldreader }
  migration:        { in: internal/migration }
  markdown:         { in: internal/markdown }
  canonical:        { in: internal/canonical }
  frontmatter:      { in: internal/frontmatter }
  filter:           { in: internal/filter }
  queryplan:        { in: internal/queryplan }
  propmatch:        { in: internal/propmatch }
  userstate:        { in: internal/userstate }
  nextaction:       { in: internal/nextaction }
  memuserstate:     { in: internal/userstate/memuserstate }
  kvuserstate:      { in: internal/userstate/kvuserstate }
  comments:         { in: internal/comments }
  memcomments:      { in: internal/comments/memcomments }
  filecomments:     { in: internal/comments/filecomments }
  pgcomments:       { in: internal/comments/pgcomments }
  sqlitecomments:   { in: internal/comments/sqlitecomments }
  schedulerstate:   { in: internal/schedulerstate }
  kvschedstate:     { in: internal/schedulerstate/kvstate }
  pgschedstate:     { in: internal/schedulerstate/pgschedstate }
  pattern:          { in: internal/pattern }
  search:           { in: internal/search }
  bleveindex:       { in: internal/search/bleveindex }
  searchparser:     { in: internal/search/searchparser }
  store:            { in: internal/store }
  fsstore:          { in: internal/store/fsstore }
  memstore:         { in: internal/store/memstore }
  graphquerynaive:  { in: internal/store/graphquerynaive }
  pgstore:          { in: internal/store/pgstore }
  sqlitestore:      { in: internal/store/sqlitestore }
  # Owns the SQLite database FILE — opening, PRAGMAs, the single-writer lock,
  # the schema ladder. Deliberately NOT under internal/store: a rela database
  # holds the entity graph AND the operator's config, and neither owns the
  # other or the file they share. Both are handed the opened handle.
  sqlitedb:         { in: internal/sqlitedb }
  storeutil:        { in: internal/store/storeutil }

  # Project bootstrap utilities
  projectsetup:     { in: internal/projectsetup }
  # Deterministic graph generator for the perf demo project. A leaf over the
  # store contract: it emits entities/relations and loads them through
  # store.Store, and must never learn about entitymanager or the metamodel.
  perfseed:         { in: internal/perfseed }
  fsimport:         { in: internal/fsimport }

  # Infrastructure
  acl:              { in: internal/acl }
  aclaudit:         { in: internal/aclaudit }
  aclmap:           { in: internal/aclmap }
  affordances:      { in: internal/affordances }
  visibility:       { in: internal/visibility }
  ai:               { in: internal/ai }
  mail:             { in: internal/mail }
  audit:            { in: internal/audit }
  jwtauth:          { in: internal/jwtauth }
  principal:        { in: internal/principal }
  secrets:          { in: internal/secrets }
  hostconfig:       { in: internal/hostconfig }
  cache:            { in: internal/cache }
  config:           { in: internal/config }
  # Serves operator config from a SQL table. A config package, not a storage
  # one: it touches no entity, relation or graph — just rows keyed by path.
  configsql:        { in: internal/config/configsql }
  # Contained (os.Root) reads of scripts/, custom/ and the like. Depends only
  # on storage, so lua can fall back to it without depending on config.
  rootfs:           { in: internal/rootfs }
  # Stores runtime state in a SQL table. A state package, not a storage one,
  # and a sibling of configsql for the same reason: neither is the entity
  # graph, and both would otherwise live in files BESIDE the database and be
  # left behind when the single file is shipped.
  statesql:         { in: internal/state/statesql }
  git:              { in: internal/git }
  output:           { in: internal/output }
  project:          { in: internal/project }
  state:            { in: internal/state }
  lock:             { in: internal/lock }
  # OAuth refresh tokens for connector scripts, sealed into state.KV, and the
  # Go-side refresher (TKT-01KZSO).
  tokenstore:       { in: internal/tokenstore }
  storage:          { in: internal/storage }

  # Shared utilities
  errors:           { in: internal/errors }
  htmlutil:         { in: internal/htmlutil }
  natsort:          { in: internal/natsort }

# -- Vendors --------------------------------------------------------------
vendors:
  bleve:       { in: github.com/blevesearch/bleve/** }
  kong:        { in: github.com/alecthomas/kong }
  # Background job queue (TKT-YOED3R). Granted ONLY to internal/jobs, which
  # is the seam that contains it: the memory backend serves the fs/desktop
  # tier and the postgres backend (build-tagged) the networked one. Keeping
  # the grant this narrow is what stops a consumer importing neoq types
  # directly and re-coupling every producer to the queue implementation.
  neoq:        { in: [github.com/acaloiaro/neoq, github.com/acaloiaro/neoq/**] }
  # Text-range anchoring for comments (TKT-FIO205 stage 2). Granted ONLY to
  # internal/comments, which contains it in textresolve.go: the library's
  # Anchor/ResolveResult types must not escape into handlers or the wire, so
  # comments.TextAnchor mirrors its fields and converts at that one seam.
  textanchor:  { in: [github.com/vloothuis/textanchor, github.com/vloothuis/textanchor/**] }
  # uuid: the per-job fingerprint when a caller supplies no IdempotencyKey.
  # A random fingerprint is what DISABLES neoq's payload-equality dedup, so
  # two identical-payload jobs both run unless dedup was asked for by name.
  uuid:        { in: github.com/google/uuid }
  # x/sys/unix: prlimit(2) for the per-command resource ceilings in cmdexec.
  # Go's syscall.SysProcAttr exposes no Rlimits field on Linux, so this is the
  # only way to bound a child's memory/PIDs/file size without a re-exec.
  xsys:        { in: golang.org/x/sys/** }
  glamour:     { in: github.com/charmbracelet/glamour }
  huh:         { in: github.com/charmbracelet/huh }
  yaml:        { in: gopkg.in/yaml.v3 }
  # CalDAV protocol surface (TKT-MF1CWZ). Granted ONLY to dataentry, which
  # contains it in the caldav_* adapter files: calfeed stays the domain model
  # and *ical.Calendar must not escape that boundary.
  webdav:
    in:
      - github.com/emersion/go-webdav
      - github.com/emersion/go-webdav/**
  goical:      { in: github.com/emersion/go-ical }
  # Outbound mail (TKT-332QZY). net/smtp is frozen and covers only the wire
  # protocol; go-mail owns RFC 5322 assembly — header folding, encoded-words,
  # quoted-printable, multipart — which is the part that is easy to get subtly
  # wrong. Granted only to mail.
  gomail:      { in: github.com/wneessen/go-mail }
  # HTML sanitize + CSS inline for mail bodies, granted to mailrender; the
  # ORDER they run in is a security property documented on that package
  # (sanitize the untrusted fragment, inline last). htmlmd also sanitizes with
  # bluemonday, in both conversion directions.
  bluemonday:  { in: github.com/microcosm-cc/bluemonday }
  htmltomarkdown:
    in:
      - github.com/JohannesKaufmann/html-to-markdown/v2/**
  douceur:
    in:
      - github.com/aymerick/douceur
      - github.com/aymerick/douceur/**
  goldmark:
    in:
      - github.com/yuin/goldmark
      - github.com/yuin/goldmark/**
      - github.com/teekennedy/goldmark-markdown
      - github.com/mitchellh/go-wordwrap
  gogit:       { in: github.com/go-git/go-git/** }
  gopherlua:   { in: [github.com/yuin/gopher-lua, github.com/yuin/gopher-lua/**] }
  chromedp:    { in: [github.com/chromedp/chromedp, github.com/chromedp/chromedp/**, github.com/chromedp/cdproto, github.com/chromedp/cdproto/**] }
  runewidth:   { in: github.com/mattn/go-runewidth }
  rrulego:     { in: github.com/teambition/rrule-go }
  mcpgo:
    in:
      - github.com/modelcontextprotocol/go-sdk/**
  wails:       { in: github.com/wailsapp/wails/** }
  keyring:     { in: github.com/zalando/go-keyring }
  tablewriter:
    in:
      - github.com/olekukonko/tablewriter
      - github.com/olekukonko/tablewriter/**
  color:       { in: github.com/fatih/color }
  fsnotify:    { in: github.com/fsnotify/fsnotify }
  pgx:         { in: github.com/jackc/pgx/** }
  # modernc.org/sqlite: the pure-Go (no cgo) SQLite driver. Granted ONLY to
  # sqlitedb, which opens the database and registers the driver, so the default
  # and postgres builds cannot link it — the same isolation rule pgx and bleve
  # carry.
  sqlite:      { in: modernc.org/sqlite }
  singleflight: { in: golang.org/x/sync/singleflight }
  semaphore:   { in: golang.org/x/sync/semaphore }
  ximage:      { in: [golang.org/x/image, golang.org/x/image/**] }
  http2:
    in:
      - golang.org/x/net/http2
      - golang.org/x/net/http2/**
  nethtml:
    in:
      - golang.org/x/net/html
      - golang.org/x/net/html/**
  jwtlib:
    in:
      - github.com/golang-jwt/jwt/**
      - github.com/MicahParks/keyfunc/**
      # keyfunc's JWKS layer. Referenced directly for its error sentinels, so a
      # JWKS-unreachable failure can be told apart from a bad assertion. The
      # package is imported at its module root, so it needs the bare path as
      # well as the subpackage glob.
      - github.com/MicahParks/jwkset
      - github.com/MicahParks/jwkset/**

# -- Common (importable by all) -------------------------------------------
commonComponents:
  - entity
  - errors
  - natsort

commonVendors:
  - yaml

# -- Dependency rules ------------------------------------------------------
deps:
  # Entry points
  cmdCli:
    mayDependOn:
      - cli
  cmdDocs:
    mayDependOn:
      - appbuild
      - docscli
      - principal
      - script
    canUse:
      - kong
  # cmdServer is a composition root, so it may name both the transport
  # (dataentry) and the protocol server it mounts inside it (mcp) — the same
  # pairing `cli` already has for the stdio transport. Keeping the MCP wiring
  # here is what lets `dataentry` take a plain http.Handler and stay off the
  # go-sdk (TKT-BDG8U9). It names `lua` only to pair the gated Lua read
  # bundle with the entity manager for the remote MCP Lua tools (TKT-4QSZ8Y).
  cmdServer:
    mayDependOn:
      - acl
      - appbuild
      - audit
      - cmdexec
      - dataentry
      - dataentrywire
      - jwtauth
      - lua
      - mcp
      - principal
      - scheduler
      - script
    canUse:
      - http2
  cmdDesktop:
    mayDependOn:
      - acl
      # ai, mail: the settings window checks ai.yaml and mail.yaml parse
      # before storing them.
      - ai
      - appbuild
      - audit
      # cmdexec: applies the host command settings (sandbox read paths,
      # confinement opt-out) at startup, like the server and CLI.
      - cmdexec
      - dataentry
      - config
      - dataentrywire
      # fsimport.Report: the import dialog lists the problems it found.
      - fsimport
      - desktop
      - desktopnotify
      - git
      # hostconfig, secrets: the desktop's host config keeps secrets in the
      # OS keychain and falls back to the .rela directory.
      - hostconfig
      - mail
      - metamodel
      - principal
      - project
      - scheduler
      - script
      - secrets
      - state
      - storage
      - store
      # The keychain token store and the settings window's Connections
      # section (TKT-01KZSO).
      - tokenstore
    canUse:
      # The OS credential store for project secrets (see
      # docs/architecture/desktop-documents.md).
      - keyring
      - wails

  desktopnotify:
    mayDependOn:
      - metamodel
      - predicate
      - predicatefns
      - store

  # CLI layer — orchestrates everything. memstore is here because
  # cli/mcp_wiring has its own per-build store seam (the FS variant
  # uses app+bleveindex, the -tags memorybackend variant uses
  # memstore). Union over build tags, same rationale as appbuild.
  cli:
    mayDependOn:
      - acl
      - aclaudit
      - aclmap
      # `rela acl audit` evaluates field visibility per role for the
      # classification findings (TKT-8UCV32) through the resolver a request
      # uses. Cycle-free: affordances is a near-leaf importing no wiring.
      - affordances
      - ai
      - classification
      - analysis
      - app
      - appbuild
      - attachment
      - audit
      - autocascade
      - automation
      - bleveindex
      - cmdexec
      - config
      - configsql
      - dataentryconfig
      - sqlitedb
      - datamigration
      - entitymanager
      - filter
      - importer
      - lua
      - markdown
      - mcp
      - memstore
      - metamodel
      - output
      - perfseed
      - fsimport
      - pgstore
      - sqlitestore
      - predicate
      - predicatefns
      - relresolve
      - principal
      - project
      - projectsetup
      - queryplan
      - renametype
      - scheduler
      - schema
      - script
      - search
      # `rela secrets credential-name` only DERIVES the systemd credential name
      # for the project — it reads no secret values. The name embeds a hash of
      # the project path (so two same-named projects cannot share a credential),
      # which makes it underivable by hand, so an operator needs a way to print
      # it for their unit file.
      - secrets
      - state
      - storage
      - store
      - templating
      # `rela token set|status|delete` (TKT-01KZSO) parses the operator's
      # token input and reports the store's typed read errors.
      - tokenstore
      - tracer
      - transform
      - validator
      # The CLI address helper resolves `ID@face` through the allow-all
      # visibility.Resolver: the operator shell reads everything, but a
      # single-entity read still takes one mode (TKT-KQXVF7).
      - visibility
    canUse:
      - kong
      - color
      - glamour
      - huh
      - tablewriter

  # Web / UI layer
  # apiwire is a leaf: it may use the domain types and the data-entry config
  # types, but MUST NOT depend on dataentry (the contract can't depend on the
  # server that serializes to it). No `dataentry` here is the whole point —
  # arch-lint fails if anyone adds that import.
  apiwire:
    # entity/errors are commonComponents (importable by all), so only the
    # data-entry config types need listing. Critically: NO `dataentry` — the
    # contract must not depend on the server that serializes to it.
    mayDependOn:
      - dataentryconfig
  dataentry:
    mayDependOn:
      - rootfs
      # The next-action engine and its per-user state. dataentry supplies the
      # ACL-gated CandidateFunc; it does NOT choose a userstate backend —
      # that is a wiring-site decision, like the store backend.
      - nextaction
      - userstate
      - acl
      - affordances
      - apiwire
      - attachment
      - audit
      - calfeed
      - caldavalias
      - canonical
      # The commentary layer (TKT-FIO205). dataentry owns the HTTP surface and
      # the ACL gating; it does NOT choose a comment backend — like userstate
      # above, that is a wiring-site decision, so only the `comments` package
      # is granted here, never filecomments/memcomments.
      - comments
      - cmdexec
      - config
      - conflict
      - dataentryconfig
      - entitymanager
      - filter
      - principal
      - git
      - htmlutil
      - lua
      # Declarative-webhook `append_section` splices a named section into an
      # entity body (TKT-1EM4KL). markdown is a near-leaf (it depends only on
      # frontmatter) and dataentry already parses markdown with goldmark
      # directly, so this reuses the reviewed parser instead of hand-rolling a
      # second heading scanner here.
      - markdown
      - mermaid
      - metamodel
      - migration
      - openapi
      - project
      - queryplan
      # Answers `related(...)` in validation rules and state-machine `when:`
      # (TKT-205V2N). Its API is funcs over acl and store types, so this edge
      # does not hand dataentry the predicate engine; dataentry only picks the
      # gate (the request gate for rules, the raw store for transitions).
      - relresolve
      # The one cardinality checker the CLI and MCP also use (TKT-5LW875).
      # The analyze view passes its gated reader, so the counts it reports
      # are folded from visible edges only.
      - schema
      - script
      - search
      - searchparser
      - state
      - statemachine
      - storage
      - store
      - templating
      - tracer
      - transform
      - validator
      - visibility
      # The world-scoped RELATION dispatch only (TKT-WRLDAPI item 4).
      # worldreader.RelationReader.Neighbors is the sole implementation of
      # the identity-vs-content scope split, and its godoc exists to make
      # reimplementation UNREPRESENTABLE — a caller handed that capability
      # cannot issue a raw nil-tail query through it. Reimplementing the
      # dispatch here to avoid this edge would be the exact mistake that
      # doc is written against, so the edge is the cheaper of the two.
      #
      # ENTITY resolution deliberately does NOT come through here: it stays
      # on the store path (store.EntityQuery.World), which is the second of
      # the two mechanisms worldreader's own package doc names. Two sites,
      # neither duplicated.
      - worldreader
    canUse:
      - goldmark
      - gogit
      - nethtml
      - rrulego
      - singleflight
      - webdav
      - goical
  dataentryconfig:
    mayDependOn:
      - filter
      - git
      - icondefs
      - metamodel
    canUse:
      - rrulego
  # conditionlint reuses the predicate parser to sanity-check wizard-form
  # condition expressions at author time. It sits above dataentryconfig so the
  # config package stays free of the predicate dependency.
  #
  # It also COMPILES next-action `condition:` expressions (TKT-N8XQ2R). Those
  # are evaluated server-side by predicatefns, not by the SPA, so unlike the
  # wizard-form checks this one is authoritative rather than a superset: it
  # must see the same host functions (days_between, today, ...) the runtime
  # will, hence predicatefns. searchparser is needed to read the entity types
  # out of the source's `query:`, which is what a condition compiles against.
  # Build-time only; never linked into a shipped binary.
  cmdGenIcons:
    mayDependOn:
      - icondefs
  conditionlint:
    mayDependOn:
      - dataentryconfig
      - metamodel
      - predicate
      - predicatefns
      - searchparser
  desktop:
    canUse:
      - wails

  # Server protocols
  #
  # mcp takes a focused mcp.Deps struct (domain types only) from the
  # cli wiring site; it holds no composition-root aggregate, so
  # appbuild is deliberately absent from this whitelist. The project
  # context no longer leaks in either — mcp.Deps carries ProjectRoot
  # as a plain string rather than a *project.Context.
  mcp:
    mayDependOn:
      - rootfs
      # acl + attachment: the attachment tools (TKT-R6U15C) authorize an
      # `update` before any bytes are stored, and drive attachment.Service,
      # the write policy the CLI and web upload paths share.
      - acl
      - ai
      - attachment
      - audit
      - config
      - dataentryconfig
      - entitymanager
      - filter
      - principal
      - lua
      - metamodel
      - predicate
      - predicatefns
      - relresolve
      - schema
      - script
      - search
      - store
      - tracer
      - validator
      # visibility.Family: GraphReader.Family returns it; the write tools
      # gate the ids they name through the injected (gated) reader before
      # calling entitymanager.
      - visibility
    canUse:
      - mcpgo
      - fsnotify
  openapi:
    mayDependOn:
      - metamodel

  # Application services
  app:
    mayDependOn:
      - fsstore
      - metamodel
      - project
      - storage
      - store
  # appbuild deps are the union across build tags. Default build
  # (!postgres && !memorybackend) imports app + bleveindex via the
  # FS seam files; -tags memorybackend imports memstore via its
  # alternative seam. arch-lint sees the whole graph reachable under
  # any tag, so both backends' deps must be allow-listed here.
  appbuild:
    mayDependOn:
      - rootfs
      # hostconfig.Dir: the default source of secrets and AI/mail settings.
      - hostconfig
      # The sqlite recipe OPENS the database and hands the same handle to both
      # the store and the config loader, so it names all three. Owning the file
      # here is what keeps a store from owning config, or config from owning a
      # store — they only share a file.
      - configsql
      - sqlitedb
      - statesql
      # Mail is optional infrastructure the composition root wires and owns the
      # lifecycle of (start in assemble, stop in Close), exactly like the
      # data-migration GC sweep. Consumers take the mail.Sender seam, not this
      # edge.
      - mail
      - mailrender
      - filter
      # The composition root picks the userstate backend, the same way it
      # picks the store backend. Consumers take the userstate.Store seam.
      - userstate
      # lock.For picks the attachment lock from the store (TKT-WE0S2K). The
      # manager and the attachment service must share one instance
      # (BUG-CTUW2N), so the composition root builds it once for both.
      - lock
      # The connector token store (TKT-01KZSO): sealed into the database
      # backend's state store, its broker shares the attachment lock. secrets
      # names the global section's "no secrets file" error.
      - tokenstore
      - secrets
      - memuserstate
      - kvuserstate
      # Likewise the commentary layer: the root picks the backend and hands the
      # service to the App, which nil-checks it to decide whether the feature
      # exists at all. The database backends are chosen by the recipe that owns
      # the handle, so they are wired from here like the store itself
      # (TKT-OGTVJW); each import sits in that recipe's tagged file.
      - comments
      - filecomments
      - pgcomments
      - sqlitecomments
      - datamigration
      # The migration-state backends, selected here for the same reason as the
      # comment backends: the recipe owns the handle each one needs, and the
      # file backend is the filesystem tier's default (TKT-XCJ0Y2).
      - filemigstate
      # `rela db load --data` and the desktop import run the fs-to-sqlite
      # copy inside the transaction the sqlite recipe opens (TKT-YNKKRQ).
      - fsimport
      - memmigstate
      - pgmigstate
      - sqlitemigstate
      # The scheduler run-state backends, selected here for the same reason.
      - schedulerstate
      - kvschedstate
      - pgschedstate
      # Bridges conditionlint's next-action condition compiler to the seam
      # dataentry declares, so the app never imports the predicate engine.
      # predicatefns + principal: the same bridge derives the query identity
      # (`current_user`) from the request principal and stamps it for the
      # matcher, so dataentry never learns the predicate engine's identity
      # type either.
      - conditionlint
      - predicatefns
      # queryscopes + predicate: the query-scope bridge (queryscopes.go)
      # compiles `query_scopes:` and hands dataentry an opaque handle plus an
      # evaluator, so dataentry never names *predicate.Program — the same
      # arrangement as the next-action matchers above.
      - queryscopes
      - predicate
      # relresolve: answers related(...) for every condition surface it wires.
      - relresolve
      - principal
      - computed
      - dataentryconfig
      - nextaction
      - acl
      # appbuild constructs the affordance resolver so the field write gate
      # and the two gated-read bundles can share ONE instance (TKT-0XL8MF).
      # Safe as a dependency edge: affordances is a near-leaf (acl, entity,
      # metamodel, predicate*, principal, statemachine) and imports no
      # wiring package, so this cannot close a cycle.
      - affordances
      - app
      - audit
      - caldavalias
      - autocascade
      - automation
      - bleveindex
      - config
      - entitymanager
      # The composition root picks the job-queue backend per tier, the same way
      # it picks the store: ephemeral in-process by default, durable PostgreSQL
      # under the postgres tag. Consumers take the jobs.Queue seam.
      - jobs
      - lua
      - memstore
      - metamodel
      - mailtemplate
      - scheduler
      - pgstore
      - sqlitestore
      - project
      - queryplan
      - script
      - search
      - state
      - statemachine
      - storage
      - store
      - templating
      - tracer
      - validator
      - visibility
      # The composition root compiles the metamodel's `worlds:` at startup so
      # an invalid pointer name fails the boot (TKT-WAV8XP).
      - worlds
      # ...and binds a compiled world to a read surface. The metamodel
      # adapters (alias canonicalization, relation-scope classification)
      # live HERE rather than in worldreader, which arch-lint pins to
      # entity + store so guard rule 1 stays structural (TKT-WAV8XP PR-D).
      - worldreader
  # backendtest supplies each build's test backend. The pgx dependency is
  # confined to its postgres-tagged file, which the default build does not
  # compile — the same arrangement pgstore uses.
  backendtest:
    mayDependOn:
      - appbuild
    canUse:
      - pgx
  # tenant resolves a verified org to the store it may reach (RES-D54281). It
  # sits ABOVE appbuild — it assembles per-tenant Services over one shared
  # configuration — so appbuild must never depend on it: a tenant map is a
  # deployment concern, and appbuild is the wiring facade the single-store
  # binaries and the desktop app also use.
  #
  # pgx is confined to the postgres-tagged dsn file, which the default build
  # does not compile — the same arrangement pgstore and backendtest use, and
  # the reason CI's "default build must not link pgx" assertion keeps holding
  # once a host wires this package.
  tenant:
    mayDependOn:
      - appbuild
    canUse:
      - pgx
      - yaml
  appbuildtest:
    mayDependOn:
      - acl
      - lock
      - appbuild
      - audit
      - autocascade
      - automation
      - bleveindex
      - config
      - entity
      - entitymanager
      - lua
      - memstore
      - metamodel
      - project
      - script
      - relresolve
      - search
      - state
      - storage
      - store
      - templating
      - tracer
      - validator
      # visibility: only for visibility.Unrestricted, which NAMES the
      # fixture's deliberately ungated reads (TKT-1WV50C).
      - visibility
  projectsetup:
    mayDependOn:
      - conditionlint
      - computed
      - dataentryconfig
      - mailtemplate
      - metamodel
      - migration
      - project
      - scheduler
      - storage
      # `rela validate` checks connections.yaml (TKT-01KZSO).
      - tokenstore
      # `rela validate` must check the pointer grammar too. The loader
      # checks world structure; grammar lives in the compiler because
      # metamodel may not import entity (TKT-WAV8XP).
      - worlds

  # Domain services
  analysis:
    mayDependOn:
      - frontmatter
      - lua
      - metamodel
      - project
      - relresolve
      - schema
      - storage
      - store
      - tracer
      - validation
      - validationgraph
  cmdexec:
    canUse:
      - xsys
  attachment:
    mayDependOn:
      - cmdexec
      - entitymanager
      - imgproc
      - metamodel
      - store
  # transform: view-export engine. Depends only on the safe-exec core (cmdexec)
  # and the schema (metamodel). It must NEVER import dataentry: the ACL-coupled
  # list renderer AND the Lua/command render override both live in dataentry and
  # are supplied to transform as Renderer implementations (see internal/transform).
  transform:
    mayDependOn:
      - cmdexec
      - metamodel
  # Pure-Go, in-process image normalize (decode/orient/re-encode). A leaf: no
  # domain imports, only the image codecs and a concurrency semaphore.
  imgproc:
    canUse:
      - ximage
      - semaphore
  # Data classification overlay (classification.yaml, TKT-8UCV32). A leaf with
  # no internal deps: the CLI hands it a Shape built from the metamodel. Only
  # cli may depend on it, because classification is descriptive metadata that
  # changes no runtime behaviour; a server-side import would be the first step
  # toward it driving behaviour, which belongs in core config instead.
  # It needs no entry here: yaml is in commonVendors.

  # Message model -> branded HTML + text/plain. A leaf in the calfeed sense: no
  # internal deps at all, so it takes a plain map of colour tokens rather than
  # dataentryconfig.ResolvedPalette (which would drag in filter/git/metamodel
  # and make "leaf" a fiction).
  mailrender:
    canUse:
      - goldmark
      - bluemonday
      - douceur
  htmlmd:
    canUse:
      - goldmark
      - bluemonday
      - htmltomarkdown
      - nethtml
  # Project declarations assemble renderer models from an injected visible
  # reader. SMTP and app wiring remain outside this package.
  mailtemplate:
    mayDependOn:
      - filter
      - mailrender
      - metamodel
      - store
  # Sender seam, transports, config and the best-effort outbox. Depends on
  # mailrender for the body model only; it reaches the store through a narrow
  # structural interface at the wiring site, never by importing appbuild.
  # Where a project's secrets and AI/mail settings come from: the .rela
  # directory by default, the OS keychain and the project's state on the
  # desktop. A leaf over secrets.
  hostconfig:
    mayDependOn:
      - secrets
  mail:
    mayDependOn:
      # hostconfig.Dir is the default mail.Source (the .rela directory).
      - hostconfig
      - mailrender
      # The SMTP password lives in .rela/secrets.yaml under smtp_password, the
      # same store Lua scripts read: an SMTP credential is no different in kind
      # from the API tokens already kept there, and TKT-DS1CR6 makes mail a
      # script consumer anyway.
      - secrets
      # transport: script (TKT-DS1CR6) runs an operator Lua script that ships
      # an already-rendered message. The arrow points mail -> lua and NEVER
      # back: lua declares its own MailSender interface at the call site, so
      # mail.send needs no import of this package and no cycle exists.
      #
      # The runtime is built with a ZERO ReadDeps and no WriteDeps, which is
      # why mail does not gain store/tracer/search here — a send script has no
      # graph access at all, by construction rather than by convention.
      - lua
      # For the fixed system:mail identity the send runtime runs as. See
      # mail.SendScriptPrincipal for why the identity is fixed rather than
      # inherited from whoever enqueued the message.
      - principal
    canUse:
      - gomail
      - gopherlua
  acl:
    mayDependOn:
      - entity
      - principal
      - store
  aclaudit:
    mayDependOn:
      - acl
  aclmap:
    mayDependOn:
      - acl
      - entity
      - principal
      - store
  affordances:
    mayDependOn:
      - acl
      - entity
      - metamodel
      - filter
      - predicate
      - predicatefns
      - principal
      - statemachine
  # Read-side ACL enforcement seam (DEC-ZBI39P): visibility wrappers over
  # the ungated pure readers. tracer is needed for the decorator's
  # interface/result types; store for the script reader's query types
  # (store.EntityQuery / store.RelationQuery appear in the iterator
  # signatures script runtimes consume — RR-RT5YV8 removed this allowance
  # when only EntityGetter was needed; TKT-ZF2DTV reinstates it with a
  # concrete use). No cycle: store depends only on metamodel.
  visibility:
    mayDependOn:
      - acl
      - affordances
      - entity
      - principal
      # visibility.Searcher gates search hits for identity-bearing consumers
      # (remote MCP, Lua), the pattern search.VisibleSearcher started.
      - search
      - store
      - tracer
  audit:
    mayDependOn:
      - principal
  jwtauth:
    # Leaf: verifies signed JWTs against a JWKS. No internal deps; only the JWT
    # vendor libs. The dataentry resolver consumes it via a local interface.
    canUse:
      - jwtlib
  renametype:
    mayDependOn:
      - metamodel
      - project
      - storage
  autocascade:
    mayDependOn:
      - audit
      - automation
  automation:
    mayDependOn:
      # canonical.HashEntity decides whether an update changed anything for
      # `on.updated`, with the value normalization the stores use.
      - canonical
      - filter
      - metamodel
      - predicate
      - predicatefns
  conflict:
    mayDependOn:
      - markdown
      - metamodel
      - project
  docs:
    mayDependOn:
      - acl
      - entity
      - lua
      # worlds: shows{world=...} compiles a declared world NAME to the
      # store.WorldScope a query takes. worlds depends only on entity,
      # metamodel and store — all of which docs already has — so this adds
      # nothing transitively, and it is the runtime-free half (no store, no
      # reads), which is exactly what a doc build needs.
      - worlds
      # principal: the refuses{}/permits{} assertion verbs authorize through
      # acl.Declarative, whose API takes a principal.Principal — so this is
      # implied by the acl dependency above rather than a new reach. The
      # package is a dependency-free leaf; docscapture lists it for the same
      # reason (TKT-DOCASSERT).
      - principal
      # visibility: only for visibility.Unrestricted, which NAMES the
      # docs runtime's deliberately ungated reads (TKT-1WV50C). It reads a
      # throwaway memstore the doc build just seeded itself.
      - visibility
      - mermaid
      - metamodel
      - store
      - memstore
      - tracer
    canUse:
      - gopherlua
  # The setters every surface serving the SPA must call after NewApp, in one
  # place so the server and the desktop cannot drift apart again.
  dataentrywire:
    mayDependOn:
      - appbuild
      - dataentry
  docscapture:
    mayDependOn:
      - acl
      - appbuild
      - dataentry
      - docs
      - principal
      - script
      - store
    canUse:
      - chromedp
      # pgx is used ONLY by the postgres-tagged scratch_postgres.go, to CREATE
      # and DROP the private schema a postgres docs build seeds its fixture
      # into. It never reaches the default build (scratch_fs.go is a no-op),
      # so the "default build must not link pgx" rule is unaffected.
      - pgx
  # docscli is the command layer for the rela-docs binary. It owns the
  # docscapture edge (and thus chromedp) so internal/cli — and the rela /
  # rela-server binaries — never link the browser. See internal/docscli.
  docscli:
    mayDependOn:
      - acl
      # appbuild: only for ValidateACLPolicy, the one schema check every
      # acl.yaml loader shares. docscapture already depends on appbuild, so
      # this adds nothing to the rela-docs binary.
      - appbuild
      - docs
      - docscapture
      - metamodel
      - project
  datamigration:
    mayDependOn:
      - audit
      - computed
      - entity
      - metamodel
      - principal
      - schema
      - state
      - store
    canUse:
      # The lua: migration step runs a sandboxed pure transform on a bare
      # gopher-lua state (no rela.* bindings) — see luastep.go.
      - gopherlua
  # Migration-state backends (TKT-XCJ0Y2). Same shape as the comments
  # backends: one implementation per storage tier, each selected by the
  # composition root. They depend on datamigration for the StateStore contract
  # and on nothing else that knows about graph content — migration state
  # records which migrations have run, not what the graph holds.
  #
  # The split exists because the state must travel WITH the data: a postgres
  # tenant's position cannot live in a file shared across tenants, and a
  # sqlite project's cannot live beside the database file meant to ship alone.
  filemigstate:
    mayDependOn:
      - datamigration
      - storage
  memmigstate:
    mayDependOn:
      - datamigration
  # The database backends take an INJECTED handle from the composition root —
  # the same pool the store, search backend and comments run on — so neither
  # depends on `store`: a migration record is not graph content.
  pgmigstate:
    mayDependOn:
      - datamigration
    canUse:
      - pgx
  # sqlitemigstate needs no driver grant: it speaks database/sql only, and
  # registering the driver stays sqlitedb's job.
  sqlitemigstate:
    mayDependOn:
      - datamigration
  # The conformance harness every backend must pass, so it necessarily builds
  # fixtures from the metamodel.
  migstatetest:
    mayDependOn:
      - datamigration
      - metamodel

  computed:
    mayDependOn:
      - metamodel
      - predicate
      - predicatefns
  entitymanager:
    mayDependOn:
      - acl
      - audit
      - autocascade
      - automation
      - computed
      - metamodel
      - principal
      - statemachine
      - store
      - templating
  importer:
    mayDependOn:
      - metamodel
      - storage
      - store
      - storeutil
  schema:
    mayDependOn:
      - dataentryconfig
      - metamodel
      - migration
      - store
  templating:
    mayDependOn:
      - markdown
      - metamodel
      - project
      - storage
    canUse:
      - goldmark
  predicate:
    mayDependOn: []
    canUse:
      - gopherlua
  predicatefns:
    mayDependOn:
      - predicate
      - filter
      - metamodel
  syncmerge:
    mayDependOn:
      - metamodel
  # relresolve answers related(...) traversals in batches for every surface
  # that evaluates them (TKT-205V2N): gated through acl, answered by store.
  relresolve:
    mayDependOn:
      - acl
      - metamodel
      - predicate
      - predicatefns
      - store
  statemachine:
    mayDependOn:
      - entity
      - metamodel
      - predicate
      - predicatefns
  tracer:
    mayDependOn:
      - store
  validation:
    mayDependOn:
      - filter
      - lua
      - markdown
      - metamodel
      - predicate
      - predicatefns
    canUse:
      - gopherlua
  validationgraph:
    mayDependOn:
      - entity
      - store
      - validation
  validator:
    mayDependOn:
      - lua
      - metamodel
      - store
      - validation
      - validationgraph

  # Core domain
  metamodel:
    mayDependOn:
      - migration
      # principal: the shared run_as validator (TKT-01KZSO), so a background
      # action and a scheduled task accept the same identities. principal is a
      # leaf.
      - principal
      # secrets: ScriptReadable refuses the token store key in a
      # capabilities.secrets list (TKT-01KZSO). secrets is a leaf.
      - secrets
      - storage
    canUse:
      - rrulego
  worlds:
    mayDependOn:
      - entity
      - metamodel
      - store

  # GUARD: `acl` is deliberately absent. A query scope MAY read current_user,
  # so unlike worlds it is not principal-independent — but the identity
  # arrives as a value bound through predicatefns, never as an authorization
  # decision. Scopes are UX; ACL decides what a principal may see, and the two
  # must not merge. Adding `acl` here would let a scope start consulting
  # grants, which is the merge.
  queryscopes:
    mayDependOn:
      - metamodel
      - predicate
      - predicatefns
  # worldreader is the RUNTIME half of worlds: it holds a store and reads.
  #
  # It deliberately may NOT depend on acl, visibility, principal or
  # affordances. That is GUARD RULE 1 (TKT-WAV8XP): world resolution is
  # principal-independent, and it must complete BEFORE the ACL gate is
  # consulted — if the gate ran first, a prime the principal may not read
  # would fall through to the chain's next candidate, and the face a
  # reader receives would reveal what the ACL denied them. Enforced here
  # AND by a package-scan test (worldreader/guard_test.go), because
  # arch-lint alone would not catch a principal read off ctx.
  #
  # It also may not depend on metamodel: the compiled WorldScope is
  # metamodel-free by construction, and a TypeCanonicalizer interface is
  # supplied at the wiring site.
  worldreader:
    mayDependOn:
      - entity
      - store
  migration:
    mayDependOn:
      - storage
  markdown:
    mayDependOn:
      - frontmatter
    canUse:
      - goldmark
  canonical:
    mayDependOn:
      - entity
      - markdown
  # userstate is the per-user next-action state seam (snooze/mute/cooldown).
  # Deliberately NOT dependent on store: this state is not graph content, and
  # letting it reach the store would invite exactly the "just put it in the
  # graph" shortcut the design rejects.
  memuserstate:
    mayDependOn:
      - userstate
  # The durable backend rides the existing per-user state seam (state.KV),
  # the same one the scheduler and document cache use.
  kvuserstate:
    mayDependOn:
      - state
      - userstate
  # comments is user commentary ABOUT entities, not graph content — a remark on
  # a property is not a fact the operator declared in schema.yaml. It therefore
  # depends on entity (for the EntityObserver signature it implements) and
  # principal (to stamp an unforgeable author), but deliberately NOT on store or
  # entitymanager: routing commentary through the graph write path would drag it
  # into the audit log, version capture, search and /_schema, none of which are
  # wanted for a note someone left on a field.
  comments:
    mayDependOn:
      - entity
      - principal
    canUse:
      - textanchor
  memcomments:
    mayDependOn:
      - comments
  # The default backend writes one YAML document per target through the shared
  # storage seam, so a thread is diffable like the entities it annotates.
  filecomments:
    mayDependOn:
      - comments
      - storage
    canUse:
      - yaml
  # The database backends (TKT-OGTVJW). Both take an INJECTED handle from the
  # composition root — the same pool the store and search backend run on — so
  # neither depends on `store`: a comment is not graph content, and these
  # packages have no reason to know a store exists. `entity` is for
  # StateRefSeparator alone (the face half of a thread key).
  #
  # pgcomments is the one that fixes a real defect: filecomments is node-local,
  # so under the multi-process postgres deployment a comment posted through one
  # node is invisible to the others.
  pgcomments:
    mayDependOn:
      - comments
      - entity
    canUse:
      - pgx
  # sqlitecomments needs no driver grant: it speaks database/sql only, and
  # registering the driver stays sqlitedb's job.
  sqlitecomments:
    mayDependOn:
      - comments
      - entity
  # schedulerstate is the per-task scheduler bookkeeping seam (last successful
  # run, failure count, next retry). Deliberately NOT dependent on store: a
  # last-run stamp is a fact about a deployment's operation, not graph content,
  # and a write per tick would land in the audit log and the version sweep.
  # (schedulerstate itself is a pure leaf — no deps entry, like entity.)
  # The filesystem/desktop backend rides state.KV, the same seam the document
  # cache and user settings use.
  kvschedstate:
    mayDependOn:
      - state
      - schedulerstate
  # The postgres backend is one row per task and per run, so several
  # rela-server processes share one schedule safely (BUG-TKL08E). Like
  # pgcomments it takes an injected handle and never imports store.
  pgschedstate:
    mayDependOn:
      - schedulerstate
    canUse:
      - pgx
  # nextaction is the resolution engine. It depends on NO store, searcher or
  # ACL type: candidates arrive through a consumer-side CandidateFunc that the
  # wiring site supplies already read-gated. That is what keeps the engine
  # testable without a graph, and what stops read-path ACL leaking in here.
  nextaction:
    mayDependOn:
      - dataentryconfig
      - entity
      - userstate
  # propmatch is a PURE LEAF (stdlib only) on purpose — it is imported by
  # both filter (a branch) and the store layer, so anything added to it
  # lands inside the store too. Do not give it dependencies.
  filter:
    mayDependOn:
      - metamodel
      - pattern
      - propmatch
  lua:
    mayDependOn:
      - rootfs
      - ai
      - filter
      # mail.render builds a mailrender.Message from a script table so a Lua
      # author gets the branded, client-hardened template instead of
      # hand-writing HTML for mail.send (TKT-1GA2PG).
      #
      # This does NOT invert the "mail -> lua and NEVER back" rule documented on
      # the mail component. That rule is about internal/mail; mailrender is a
      # separate component and a true leaf (its own entry allows no internal
      # deps at all, and `go list -deps` confirms it imports nothing internal),
      # so this arrow cannot close a cycle. lua still must not depend on mail.
      - mailrender
      # rela.md.from_html / to_html (TKT-LAMZ8F); a leaf, no cycle possible.
      - htmlmd
      - metamodel
      - principal
      - search
      - secrets
      - store
      # rela.sync.merge classifies through the pure merge package.
      - syncmerge
      - tracer
      # visibility.Family: the write bindings gate the ids they name through
      # the runtime's VisibleReader before calling the manager.
      - visibility
    canUse:
      - goldmark
      - gopherlua
      - runewidth
      - rrulego
  # The job seam. Deliberately a near-leaf: it must NOT depend on store,
  # entitymanager, or any subsystem that produces jobs, or the seam becomes
  # a cycle. Commit deferral is driven by a ctx collector the transaction
  # seam populates, which is why no store import is needed here.
  jobs:
    canUse:
      - neoq
      - uuid
  scheduler:
    mayDependOn:
      - audit
      - jobs
      - config
      - lua
      - metamodel
      - filter
      - principal
      - project
      - schedulerstate
      - script
      - state
    canUse:
      - uuid
  script:
    mayDependOn:
      - ai
      - autocascade
      - lua
      # The mail.send binding's transport. This package supplies
      # mail.LoadLuaSender to lua.LoadContextOptions because internal/lua
      # cannot import internal/mail (mail -> lua already, for transport:
      # script), so the adapter has to live at a site that sees both.
      - mail
      # The default host config when ReadDeps.Host is nil.
      - hostconfig
      - metamodel
      - principal
      - project
  search:
    mayDependOn:
      - filter
      - store
    canUse:
      - bleve
  bleveindex:
    mayDependOn:
      - search
      - store
    canUse:
      - bleve
  searchparser:
    mayDependOn:
      - filter
  queryplan:
    mayDependOn:
      # Static index derivation must refuse exactly the configs the server
      # refuses, so it runs the same next-action condition compiler.
      - conditionlint
      - dataentryconfig
      - filter
      - metamodel
      - predicate
      - predicatefns
      - searchparser
      - store
  store:
    mayDependOn:
      - metamodel
  fsstore:
    mayDependOn:
      - cache
      - frontmatter
      - graphquerynaive
      - markdown
      - storage
      - store
      - storeutil
  memstore:
    mayDependOn:
      - graphquerynaive
      - store
      - storeutil
  graphquerynaive:
    mayDependOn:
      - entity
      - propmatch
      - store
  pgstore:
    mayDependOn:
      # The postgres build carries its own next-action state backend: it is the
      # only one safe for a multi-process deployment, and it rides the pool
      # this package already owns rather than opening a second one.
      - userstate
      - canonical
      - graphquerynaive
      - search
      - store
      - storeutil
    canUse:
      - pgx
  sqlitestore:
    mayDependOn:
      # Still narrower than pgstore: no userstate. This backend keeps the
      # filesystem KV on purpose (TKT-L1A3PH), and each further entry should
      # have to justify widening this list.
      - entity
      - graphquerynaive
      # The FTS5 search backend (DEC-10Z731) implements search.Backend, as
      # pgstore's in-database search does.
      - search
      - sqlitedb
      - store
      - storeutil
      # Added by TKT-4NU9ZD (DEC-LFSYNY stage 4, content versioning) — the
      # stage this list's previous note said would have to justify itself.
      #
      # canonical.HashEntity is the content-dedup hash a capture is keyed on,
      # and it must be the SAME function pgstore uses: the hash decides whether
      # an edit is a no-op the sweep can swallow, so two backends computing it
      # differently would version the same edit differently. Re-deriving it
      # here is exactly the drift the shared package exists to prevent.
      - canonical
    canUse:
      # Only for *sqlite.Error, to tell a constraint violation from any other
      # failure. Opening the database — and registering the driver — is
      # sqlitedb's.
      - sqlite
  storeutil:
    mayDependOn:
      - store

  # Infrastructure
  # ai: pure leaf — only stdlib (net/http, log/slog, encoding/json) plus
  # yaml (already in commonVendors). The Provider interface is consumed
  # by lua, script, cli, and mcp. No mayDependOn/canUse entry needed
  # because the component is component-only with no internal deps.
  # cache: pure in-memory utility, no internal deps
  config:
    mayDependOn:
      - storage
  rootfs:
    # Only storage, for the file watcher behind Subscribe.
    mayDependOn:
      - storage

  configsql:
    # Only config, for the Loader interface it implements. No store, no
    # metamodel, no driver: it takes a *sql.DB the caller already opened, so
    # the sqlite driver grant stays with the package that registers it.
    mayDependOn:
      - config
  # statesql has NO internal deps, so it has no entry here. It deliberately
  # does not import state: that package WRAPS this one (state.ValidatedKV
  # applies the key rules), so naming it would invert the dependency.
  # Conformance is proved by state/statetest instead, which checks behavior
  # rather than shape.
  sqlitedb:
    canUse:
      - sqlite
      # x/sys for flock/LockFileEx: the single-writer sidecar lock. Go's
      # stdlib exposes no portable advisory file lock.
      - xsys
  git:
    canUse:
      - gogit
  output:
    mayDependOn:
      - tracer
    canUse:
      - color
      - tablewriter
  project:
    mayDependOn:
      - storage
  caldavalias:
    mayDependOn:
      - state

  state:
    mayDependOn:
      - storage
  # Depends only on state: the lock, the secrets and the HTTP client are
  # consumer-side interfaces the wiring site satisfies.
  tokenstore:
    mayDependOn:
      - state
  fsimport:
    mayDependOn:
      - app
      - audit
      - canonical
      - comments
      - filecomments
      - datamigration
      - filemigstate
      - entity
      - frontmatter
      - metamodel
      - principal
      - project
      - state
      - storage
      - store
  perfseed:
    mayDependOn:
      - store
      - storeutil
  storage:
    anyProjectDeps: true
    canUse:
      - fsnotify
